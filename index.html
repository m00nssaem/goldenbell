<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>🏆 학교 골든벨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
<style>
  :root{
    /* 교실에서 가져온 색: 칠판, 분필, 교실 벽, 종(놋쇠), 빨간 색연필 */
    --board:#1F3A32;        /* 칠판 */
    --board-ink:#F4F3EC;    /* 분필 */
    --gold:#D9A520;         /* 종 (주요 버튼에만) */
    --gold-deep:#7E5C0E;
    --gold-soft:#F5E7BC;
    --cream:#E8ECE5;        /* 교실 벽 (배경) */
    --card:#FFFFFF;
    --ink:#1C2420;
    --ink-soft:#5F6964;
    --line:#D2D9D0;
    --green:#2D7A4E;
    --green-soft:#E1EFE5;
    --red:#C23B2B;          /* 빨간 색연필 */
    --red-soft:#F7E2DE;
    --amber:#E39A2B;
    --navy:#1F3A32;
    --navy-soft:#26463C;
    --navy-line:rgba(244,243,236,.12);
    --radius:12px;
    --radius-sm:8px;
    --font-body:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-display:'Black Han Sans','Pretendard',sans-serif;
    --shadow:none;
    --footer-h:44px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    color:var(--ink);
    min-height:100vh;
  }
  body.page-student, body.page-admin{ background:var(--cream); }
  body.page-goldenbell{ background:var(--gb-bg); color:var(--gb-fg); overflow-x:hidden; transition:background .3s, color .3s;
    /* 골든벨 화면의 모든 크기는 이 글자 크기(em) 기준 → 전자칠판처럼 큰 화면일수록 같이 커짐 */
    font-size:clamp(15px, 0.95vw + 0.6vh, 40px); }
  #app{ min-height:calc((100vh - var(--footer-h)) / var(--z, 1)); }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; }
  button{ cursor:pointer; border:none; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- shared ---------- */
  .fade-in{ }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .pop{ animation:pop .4s ease-out; }
  @keyframes pop{ 0%{transform:scale(.85);opacity:0;} 60%{transform:scale(1.04);opacity:1;} 100%{transform:scale(1);} }
  .reveal{ animation:reveal .4s ease-out; }
  @keyframes reveal{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  .spin{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
  .btn{ border-radius:var(--radius-sm); font-weight:700; padding:13px 18px; transition:background-color .15s, filter .15s; }
  .btn:active{ filter:brightness(.95); }
  .btn-gold{ background:var(--gold); color:#2A2208; }
  .btn-gold:hover{ filter:brightness(1.05); }
  .btn-dark{ background:var(--board); color:var(--board-ink); }
  .btn-ghost{ background:#E3E9E1; color:var(--ink); }
  .btn-red{ background:var(--red-soft); color:var(--red); }
  .btn-red-solid{ background:var(--red); color:#fff; }
  .btn-green{ background:var(--green); color:#fff; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .pill-btn{ padding:11px 6px; border-radius:var(--radius-sm); font-weight:600; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); text-align:center; }
  .pill-btn.active{ background:var(--board); border-color:var(--board); color:var(--board-ink); }
  .input{ width:100%; padding:13px 14px; border-radius:var(--radius-sm); border:1px solid #C3CCC1; outline:none; background:#fff; color:var(--ink); }
  .input:focus{ border-color:var(--board); box-shadow:0 0 0 3px rgba(31,58,50,.12); }
  .label{ display:block; font-weight:700; font-size:15px; margin-bottom:8px; color:var(--ink); }
  .error-box{ font-size:14px; font-weight:600; color:var(--red); background:var(--red-soft); border-left:3px solid var(--red); border-radius:4px; padding:11px 14px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  /* 팝업 창 */
  .modal-back{ position:fixed; inset:0; z-index:90; background:rgba(20,18,10,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 14px; overflow-y:auto; }
  .modal-box{ background:#fff; color:var(--ink); border-radius:var(--radius); width:100%; max-width:560px; padding:22px; box-shadow:0 18px 40px rgba(0,0,0,.22); animation:pop .2s ease-out; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h3{ margin:0; font-size:17px; font-weight:800; }
  .modal-x{ background:none; font-size:20px; color:var(--ink-soft); padding:4px 8px; }
  .q-row-click{ cursor:pointer; }
  .q-row-click:hover{ text-decoration:underline; }
  /* 큰 화면(전자칠판·큰 모니터)에서는 관리자·학생 화면 전체를 비율대로 키움 */
  :root{ --z:1; }
  @media (min-width:1500px){ :root{ --z:1.12; } }
  @media (min-width:1900px){ :root{ --z:1.25; } }
  @media (min-width:2500px){ :root{ --z:1.6; } }
  @media (min-width:3400px){ :root{ --z:2.1; } }
  body.page-goldenbell{ --z:1; }
  body:not(.page-goldenbell) #app, .modal-back{ zoom:var(--z); }
  .modal-back{ width:calc(100vw / var(--z)); height:calc(100vh / var(--z)); inset:0 auto auto 0; }
  /* 모든 화면 맨 아래 제작자 표시 */
  .site-footer{ height:var(--footer-h); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-soft); opacity:.6; letter-spacing:.02em; }
  body.page-goldenbell .site-footer{ color:var(--gb-faint); opacity:1; }
  @media print{ .site-footer{ display:none; } }

  /* ---------- student page ---------- */
  .student-wrap{ max-width:600px; margin:0 auto; padding:32px 16px 40px; }
  .brand{ text-align:center; margin-bottom:4px; font-family:var(--font-display); font-size:30px; letter-spacing:.01em; color:var(--board); }
  .bell{ width:1em; height:1em; vertical-align:-0.13em; margin-right:.28em; color:var(--gold); }
  .gate-bell{ text-align:center; font-size:46px; line-height:1; margin-bottom:10px; }
  .gate-bell .bell{ margin:0; }
  .brand-sub{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
  .dots{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; }
  .dot{ width:8px; height:8px; border-radius:99px; background:#B8C2B6; transition:all .25s; }
  .dot.current{ width:30px; background:var(--board); }
  .dot.done{ width:8px; background:var(--green); }
  .choice-idx{ width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:99px; background:#E3E9E1; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .spinner{ width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--board); border-radius:99px; margin:0 auto; }
  .who-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .who-chip{ font-size:14px; font-weight:800; }
  .count-chip{ font-size:12px; font-weight:700; border-radius:99px; padding:5px 11px; background:#E3E9E1; color:var(--ink-soft); }
  .count-chip.on{ background:var(--gold-soft); color:var(--gold-deep); }
  .q-section{ border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:14px; }
  .q-section-title{ margin:0; font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; }
  .q-step{ width:24px; height:24px; border-radius:99px; background:var(--board); color:var(--board-ink); font-size:12px; display:inline-flex; align-items:center; justify-content:center; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:4px; background:#E3E9E1; border-radius:10px; padding:4px; }
  .seg-btn{ display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; border-radius:7px; font-weight:700; font-size:14px; color:var(--ink-soft); cursor:pointer; }
  .seg-btn input{ position:absolute; opacity:0; pointer-events:none; }
  .seg-btn.active{ background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .choice-row{ display:flex; align-items:center; gap:8px; }
  .choice-mark{ width:38px; height:38px; flex-shrink:0; border-radius:99px; border:1px solid #C3CCC1; background:#fff; color:var(--ink-soft); font-weight:800; font-size:14px; }
  .choice-mark.active{ background:var(--green); border-color:var(--green); color:#fff; }
  .choice-mark.active::after{ content:"✓"; font-size:12px; margin-left:1px; }
  .choice-row:has(.choice-mark.active) .choice-input{ border-color:var(--green); background:var(--green-soft); }
  .pen-mark{ margin-left:auto; color:var(--red); font-size:34px; font-weight:400; line-height:1; font-family:'Times New Roman',serif; }
  .score-big{ font-family:var(--font-display); font-size:64px; line-height:1; color:var(--red); }
  .score-big small{ font-size:28px; color:var(--ink-soft); }
  .p-tag{ font-size:12px; font-weight:700; background:#E3E9E1; color:var(--board); border-radius:6px; padding:5px 11px; max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p-question{ font-size:20px; font-weight:800; line-height:1.55; white-space:pre-wrap; margin:4px 0; word-break:keep-all; }
  .p-choice{ display:flex; align-items:center; gap:12px; text-align:left; width:100%; padding:14px 16px; border-radius:var(--radius-sm); border:1px solid #C3CCC1; background:#fff; color:var(--ink); font-size:16px; font-weight:700; transition:border-color .15s, transform .1s; }
  .p-choice:hover:not(:disabled){ border-color:var(--board); }
  .p-choice:active:not(:disabled){ transform:scale(.99); }
  .p-choice:disabled{ cursor:default; }
  .center-screen{ min-height:calc((100vh - var(--footer-h)) / var(--z, 1)); display:flex; align-items:center; justify-content:center; padding:24px; }

  /* ---------- admin page ---------- */
  .admin-wrap{ max-width:1680px; margin:0 auto; padding:22px clamp(16px, 3vw, 48px) 60px; }
  .admin-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .admin-title{ font-family:var(--font-display); font-size:24px; display:flex; align-items:center; color:var(--board); }
  .live-dot{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--green); font-weight:700; }
  .live-dot span.d{ width:8px; height:8px; border-radius:99px; background:var(--green); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .notice{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:100; max-width:calc(100% - 32px); background:var(--ink); color:#fff; font-size:14px; font-weight:600; border-radius:13px; padding:12px 18px; box-shadow:0 8px 24px rgba(0,0,0,.25); display:none; }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:700px){ .stat-grid{ grid-template-columns:repeat(4,1fr);} }
  .stat-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .stat-label{ font-size:12px; color:var(--ink-soft); }
  .stat-value{ font-size:28px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .two-col{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
  @media(min-width:850px){ .two-col{ grid-template-columns:2fr 1fr; } }
  .bar-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:7px; }
  .bar-label{ width:44px; flex-shrink:0; color:var(--ink-soft); }
  .bar-track{ flex:1; height:10px; border-radius:99px; background:#E0E6DE; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; background:var(--board); transition:width .4s; }
  .bar-val{ width:24px; text-align:right; font-weight:700; color:var(--ink-soft); }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; padding:11px 10px; color:var(--ink-soft); font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:11px 10px; border-bottom:1px solid #E6EBE4; vertical-align:top; }
  tr:hover td{ background:#F4F7F3; }
  .truncate{ max-width:clamp(220px, 22vw, 520px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{ padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; }
  .badge.approved{ background:var(--green-soft); color:var(--green); }
  .badge.pending{ background:#F5E7BC; color:#7E5C0E; }
  .table-wrap{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; }
  .empty-box{ background:#fff; border:1px dashed #BAC4B8; border-radius:var(--radius); padding:44px 20px; text-align:center; color:var(--ink-soft); }
  .btn-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .qr-box canvas, .qr-box img{ display:block; }
  .head-actions{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .user-chip{ font-size:13px; font-weight:700; color:var(--ink); padding:7px 4px; margin-right:6px; }
  .head-link{ background:none; color:var(--ink-soft); font-size:13px; font-weight:600; padding:8px 8px; border-radius:10px; }
  .head-link:hover{ background:#E3E9E1; color:var(--ink); }
  .tab-bar{ display:flex; gap:0; background:var(--cream); border-bottom:2px solid var(--line); margin:18px 0 16px; overflow-x:auto; position:sticky; top:0; z-index:20; }
  .tab-btn{ min-width:max-content; padding:12px 18px; margin-bottom:-2px; border-bottom:3px solid transparent; background:none; font-weight:700; color:var(--ink-soft); font-size:15px; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{ color:var(--board); border-bottom-color:var(--board); background:#fff; border-radius:8px 8px 0 0; }
  .tab-count{ background:var(--red); color:#fff; border-radius:99px; padding:1px 7px; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .panel-grid{ display:grid; grid-template-columns:1fr; gap:14px; align-items:start; }
  @media(min-width:860px){ .panel-grid{ grid-template-columns:1fr 1fr; } }
  .charts-card{ padding:14px 18px; }
  .charts-card summary{ cursor:pointer; font-weight:700; font-size:14px; list-style:none; display:flex; align-items:center; justify-content:space-between; }
  .charts-card summary::after{ content:"펼치기 ▾"; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .charts-card[open] summary::after{ content:"접기 ▴"; }
  .charts-card summary::-webkit-details-marker{ display:none; }

  /* ---------- goldenbell (quiz) page ---------- */
  .gb-topbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.6em; padding:.55em 1em; border-bottom:1px solid var(--gb-line); position:relative; }
  .gb-progress{ display:flex; align-items:center; gap:.6em; min-width:0; max-width:14em; }
  .gb-count{ font-weight:800; font-size:1.4em; white-space:nowrap; }
  .gb-count small{ font-size:.6em; color:var(--gb-muted); font-weight:600; }
  .gb-top-right{ display:flex; align-items:center; justify-content:flex-end; gap:.45em; }
  @media(max-width:700px){ .gb-topbar{ grid-template-columns:1fr auto; } .gb-subject-chip{ grid-column:1 / -1; grid-row:2; justify-self:center; } }
  .gb-progress-track{ flex:1; height:.35em; background:var(--gb-line); border-radius:99px; overflow:hidden; }
  .gb-progress-fill{ height:100%; background:var(--gold); border-radius:99px; transition:width .5s; }
  .gb-subject-chip{ padding:.4em 1em; border-radius:99px; background:var(--gb-surface2); font-weight:700; font-size:1em; max-width:50vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gb-icon-btn{ width:1.9em; height:1.9em; border-radius:99px; background:var(--gb-surface2); color:var(--gb-fg); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .gb-icon-btn:hover{ background:var(--gb-line); }
  .gb-survivors{ display:inline-flex; align-items:center; gap:.35em; padding:.3em .5em; border-radius:.8em; background:var(--gb-surface); }
  .timer-wrap{ position:relative; width:3.4em; height:3.4em; flex-shrink:0; }
  .timer-svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer-value{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.15em; }
  .timer-value.urgent{ color:var(--amber); }
  .timer-none{ display:flex; align-items:center; gap:.3em; color:var(--gb-muted); font-weight:600; font-size:.8em; }
  .gb-settings-panel{ position:absolute; top:100%; right:1em; z-index:30; width:320px; font-size:15px; background:var(--gb-panel); border:1px solid var(--gb-line); border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.4); padding:16px; }
  .gb-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2.5vh 3vw; text-align:center; min-height:52vh; }
  .gb-qnum{ color:var(--gold); font-weight:800; font-size:1.05em; margin-bottom:.4em; letter-spacing:.02em; }
  .gb-question{ font-family:var(--font-display); font-size:clamp(28px, 2.9vw + 1.8vh, 130px); max-width:94vw; line-height:1.38; margin-bottom:.55em; white-space:pre-wrap; word-break:keep-all; }
  .gb-choices{ display:grid; grid-template-columns:1fr; gap:.6em; width:100%; max-width:min(94vw, 2200px); margin-bottom:1.1em; }
  @media(min-width:640px){ .gb-choices{ grid-template-columns:1fr 1fr; } }
  .gb-choice{ padding:.65em .9em; border-radius:.4em; font-size:1.45em; font-weight:700; border:2px solid var(--gb-line); background:var(--gb-surface); display:flex; align-items:center; gap:12px; text-align:left; }
  .gb-choice.correct{ background:var(--gold); border-color:var(--gold-soft); color:#2A2208; }
  .gb-choice-idx{ width:1.5em; height:1.5em; flex-shrink:0; border-radius:99px; background:var(--gb-surface2); display:flex; align-items:center; justify-content:center; font-size:.75em; }
  .gb-choice.correct .gb-choice-idx{ background:rgba(0,0,0,.15); }
  .gb-reveal-btn{ padding:.7em 1.7em; border-radius:.6em; background:var(--gb-fg); color:var(--gb-bg); font-weight:800; font-size:1.1em; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .gb-answer-card{ background:var(--gold); border-radius:.5em; padding:.8em 1.3em; max-width:min(90vw, 1600px); width:auto; min-width:min(28em, 90vw); color:#2A2208; }
  .gb-answer-label{ font-size:.75em; font-weight:800; opacity:.75; margin-bottom:.2em; }
  .gb-answer-text{ font-size:2em; font-weight:800; white-space:pre-wrap; line-height:1.3; }
  .gb-accepted{ font-size:1.05em; font-weight:700; margin-top:.35em !important; }
  .gb-accepted b{ font-size:.75em; background:rgba(0,0,0,.12); border-radius:.3em; padding:.1em .45em; margin-right:.35em; vertical-align:.1em; }
  .gb-author{ margin-top:.8em; color:var(--gb-muted); font-size:.85em; }
  .gb-author b{ color:var(--gb-fg); }
  .gb-bottombar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.6em; padding:.6em 1em; border-top:1px solid var(--gb-line); }
  .gb-bottom-center{ display:flex; gap:.45em; justify-content:center; }
  .gb-bottom-side{ min-width:0; }
  .gb-keys{ text-align:right; font-size:.65em; color:var(--gb-faint); }
  .gb-nav-main{ padding:.65em 1.5em; font-size:1em; }

  return BAD_WORDS.some((w) => normalized.includes(w.toLowerCase()));
}
function isRepeatedChar(text) {
  const cleaned = text.replace(/\s/g, "");
  if (cleaned.length < 4) return false;
  const counts = {};
  for (const ch of cleaned) counts[ch] = (counts[ch] || 0) + 1;
  const maxCount = Math.max(...Object.values(counts));
  return maxCount / cleaned.length >= 0.6;
}
function isSpecialCharOnly(text) {
  const cleaned = text.replace(/\s/g, "");
  if (!cleaned) return true;
  return !/[가-힣a-zA-Z0-9]/.test(cleaned);
}

/* ---------------- 검증 ---------------- */
function validateStudentInfo({ studentClass, number, name }) {
  if (!studentClass) return { valid: false, message: "반을 선택해주세요." };
  if (!number || !String(number).trim()) return { valid: false, message: "번호를 입력해주세요." };
  if (!/^\d{1,2}$/.test(String(number).trim())) return { valid: false, message: "번호는 숫자로 입력해주세요." };
  if (!name || !name.trim()) return { valid: false, message: "이름을 입력해주세요." };
  if (name.trim().length > 10) return { valid: false, message: "이름이 너무 깁니다." };
  return { valid: true };
}
function validateQuestion({ type, question, answer, choices, correctChoice }) {
  if (!question || !question.trim()) return { valid: false, message: "문제를 입력해주세요." };
  const q = question.trim();
  if (q.length < 5) return { valid: false, message: "문제가 너무 짧습니다. 최소 5자 이상 입력해주세요." };
  if (isSpecialCharOnly(q)) return { valid: false, message: "문제에 특수문자만 입력할 수 없습니다." };
  if (isRepeatedChar(q)) return { valid: false, message: "의미 없는 반복 문자는 사용할 수 없습니다." };
  if (containsBadWord(q)) return { valid: false, message: "문제에 부적절한 단어가 포함되어 있습니다." };
  if (type === QUESTION_TYPES.MULTIPLE) {
    if (!choices || choices.length !== CHOICE_COUNT) return { valid: false, message: `보기를 ${CHOICE_COUNT}개 모두 입력해주세요.` };
    for (let i = 0; i < choices.length; i++) {
      if (!choices[i] || !choices[i].trim()) return { valid: false, message: `보기${i + 1}을 입력해주세요.` };
      if (containsBadWord(choices[i])) return { valid: false, message: `보기${i + 1}에 부적절한 단어가 포함되어 있습니다.` };
    }
    const trimmed = choices.map((c) => c.trim());
    if (new Set(trimmed).size !== trimmed.length) return { valid: false, message: "같은 내용의 보기가 있습니다. 보기를 서로 다르게 입력해주세요." };
    if (!correctChoice) return { valid: false, message: "정답 번호를 선택해주세요." };
  }
  // 객관식은 정답 텍스트를 비워 두면 선택한 정답 보기로 자동 채움
  if (type !== QUESTION_TYPES.MULTIPLE && (!answer || !answer.trim())) return { valid: false, message: "모범 답안을 입력해주세요." };
  if (answer && containsBadWord(answer)) return { valid: false, message: "답에 부적절한 단어가 포함되어 있습니다." };
  return { valid: true };
}

/* ---------------- 랜덤 추첨 ---------------- */
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickRandomQuestions(pool, options) {
  const { count, scope = "all", scopeValue = "", typeMode = "ratio", multiplePercent = 70 } = options;
  let scoped = pool;
  if (scope === "class" && scopeValue) scoped = pool.filter((q) => q.class === scopeValue);
  else if (scope === "subject" && scopeValue) scoped = pool.filter((q) => q.subject === scopeValue);
  else if (scope === "unit" && scopeValue) scoped = pool.filter((q) => `${q.subject}||${q.unit || ""}` === scopeValue);

  const multipleList = shuffle(scoped.filter((q) => q.type === QUESTION_TYPES.MULTIPLE));
  const essayList = shuffle(scoped.filter((q) => q.type === QUESTION_TYPES.ESSAY));

  let needMultiple = 0, needEssay = 0;
  if (typeMode === "multipleOnly") needMultiple = count;
  else if (typeMode === "essayOnly") needEssay = count;
  else { needMultiple = Math.round((count * multiplePercent) / 100); needEssay = count - needMultiple; }

  let takenMultiple = multipleList.slice(0, needMultiple);
  let takenEssay = essayList.slice(0, needEssay);
  let shortageMultiple = needMultiple - takenMultiple.length;
  let shortageEssay = needEssay - takenEssay.length;

  if (typeMode === "ratio") {
    if (shortageMultiple > 0) takenEssay = [...takenEssay, ...essayList.slice(takenEssay.length, takenEssay.length + shortageMultiple)];
    if (shortageEssay > 0) takenMultiple = [...takenMultiple, ...multipleList.slice(takenMultiple.length, takenMultiple.length + shortageEssay)];
  }
  const picked = shuffle([...takenMultiple, ...takenEssay]);
  return { picked, requested: count, shortage: picked.length < count };
}

/* ---------------- CSV 다운로드 ---------------- */
function exportQuestionsToCSV(questions, filename = "questions.csv") {
  const headers = ["반","번호","이름","과목","학년-학기","단원","교과서 쪽수","유형","문제","답","인정 답안","보기1","보기2","보기3","보기4","정답번호","작성시간","승인여부"];
  const escapeCSV = (value) => {
    if (value === null || value === undefined) return "";
    const str = String(value);
    if (str.includes(",") || str.includes("\n") || str.includes('"')) return `"${str.replace(/"/g, '""')}"`;
    return str;
  };
  const rows = questions.map((q) => {
    const choices = q.choices || [];
    const createdAt = q.createdAt?.toDate ? q.createdAt.toDate().toLocaleString("ko-KR") : "";
    return [q.class, q.number, q.name, q.subject, q.gradeTerm || "", q.unit || "", q.page || "", q.type, q.question, q.answer, acceptedList(q).join(" | "),
      choices[0] || "", choices[1] || "", choices[2] || "", choices[3] || "",
      q.correctChoice || "", createdAt, q.isApproved ? "승인" : "미승인"].map(escapeCSV);
  });
  const csvContent = "\uFEFF" + [headers.join(","), ...rows.map((r) => r.join(","))].join("\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* ---------------- CSV 가져오기 ---------------- */
function parseCSV(text) {
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  const s = String(text).replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inQuotes) {
      if (c === '"') { if (s[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else if (c === "\r" && s[i + 1] === "\n") continue; // 엑셀 저장 시 생기는 \r\n → \n
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && s[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((v) => v.trim() !== ""));
}
// 이 앱에서 내려받은 CSV를 문제 객체로 변환 (열 이름으로 찾으므로 열 순서가 달라도 됨)
function csvRowsToQuestions(rows) {
  if (rows.length < 2) return { items: [], skipped: 0, error: "CSV에 문제가 없습니다." };
  const header = rows[0].map((h) => h.trim());
  const col = (name) => header.indexOf(name);
  if (col("문제") < 0 || col("유형") < 0 || col("과목") < 0) return { items: [], skipped: 0, error: "골든벨에서 내려받은 CSV 파일이 아닌 것 같아요. (문제·유형·과목 열이 없음)" };
  const get = (r, name) => { const i = col(name); return i >= 0 ? String(r[i] ?? "").trim() : ""; };
  const items = []; let skipped = 0;
  rows.slice(1).forEach((r) => {
    const type = get(r, "유형");
    const question = get(r, "문제");
    const subject = get(r, "과목");
    const choices = [1, 2, 3, 4].map((n) => get(r, `보기${n}`));
    const correctChoice = get(r, "정답번호");
    let answer = get(r, "답");
    if (!question || !subject || !Object.values(QUESTION_TYPES).includes(type)) { skipped++; return; }
    if (type === QUESTION_TYPES.MULTIPLE) {
      if (choices.some((c) => !c) || !/^[1-4]$/.test(correctChoice)) { skipped++; return; }
      if (!answer) answer = choices[Number(correctChoice) - 1];
    } else if (!answer) { skipped++; return; }
    const page = normalizePage(get(r, "교과서 쪽수"));
    items.push({
      class: get(r, "반") || "다른 반", number: get(r, "번호"), name: get(r, "이름") || "익명",
      subject, gradeTerm: /^[1-6]-[12]$/.test(get(r, "학년-학기")) ? get(r, "학년-학기") : "", unit: get(r, "단원"), page: PAGE_PATTERN.test(page) ? page : "",
      type, question: question.slice(0, 500), answer: answer.slice(0, 500),
      acceptedAnswers: type === QUESTION_TYPES.MULTIPLE ? [] : parseAccepted(get(r, "인정 답안").replace(/\s*\|\s*/g, "\n")),
      choices: type === QUESTION_TYPES.MULTIPLE ? choices : [],
      correctChoice: type === QUESTION_TYPES.MULTIPLE ? correctChoice : "",
    });
  });
  return { items, skipped, error: "" };
}

/* ---------------- 관리자 인증 (Firebase Authentication) ----------------
   - 화면에서는 아이디/비밀번호만 입력하고, 내부적으로 "아이디@goldenbell.app" 이메일 계정을 씀
   - admins/{아이디} 문서에는 해당 계정의 uid만 저장 (비밀번호 해시 저장 안 함)
   - 예전 방식(비밀번호 해시) 계정은 처음 로그인할 때 자동으로 옮겨짐 */
const ADMIN_EMAIL_DOMAIN = "goldenbell.app";
const adminEmail = (idKey) => `${idKey}@${ADMIN_EMAIL_DOMAIN}`;
function ownerIdFromUser(user) {
  const email = user && user.email ? user.email.toLowerCase() : "";
  return email.endsWith("@" + ADMIN_EMAIL_DOMAIN) ? email.slice(0, -(ADMIN_EMAIL_DOMAIN.length + 1)) : null;
}
let authReady = false;
let authBusy = false;   // 가입·계정 옮기기 도중에는 화면을 다시 그리지 않음
let currentOwner = null; // 로그인한 계정의 아이디 (구글 계정인데 아이디를 아직 안 정했으면 null)
let shownState;          // 관리자 화면에 지금 그려져 있는 상태
const adminState = () => auth.currentUser ? (currentOwner || "__setup__") : null;

// 로그인 계정 → 아이디 찾기: adminUids 연결 문서, 없으면 "아이디@goldenbell.app" 이메일에서
async function resolveOwner(user) {
  if (!user) return null;
  try {
    const snap = await getDoc(doc(db, COLLECTIONS.ADMIN_UIDS, user.uid));
    if (snap.exists() && snap.data().ownerId) return snap.data().ownerId;
  } catch (e) { console.warn("계정 연결 정보 확인 실패:", e); }
  const fromEmail = ownerIdFromUser(user);
  if (fromEmail) ensureUidLink(user.uid, fromEmail);
  return fromEmail;
}
// 아이디/비밀번호 계정도 uid 연결 문서를 만들어 두면, 나중에 구글 계정을 연결해도 같은 아이디로 들어옴
function ensureUidLink(uid, ownerId) {
  setDoc(doc(db, COLLECTIONS.ADMIN_UIDS, uid), { ownerId }).catch(() => {});
}
onAuthStateChanged(auth, async (user) => {
  if (authBusy) return;
  currentOwner = await resolveOwner(user);
  authReady = true;
  // 로그인 상태가 실제로 바뀌었을 때만 다시 그림 (오류 문구가 지워지지 않도록)

});

const PAGE_PATTERN = /^\d{1,3}(\s*[~\-]\s*\d{1,3})?$/;
function normalizePage(p) { return String(p || "").trim().replace(/\s*[~\-]\s*/, "~"); }
// 서술형 '정답으로 인정할 답' (한 줄에 하나 또는 쉼표로 구분해 입력)

          ${items.slice().reverse().map((h, i) => `
            <div style="display:flex;gap:8px;font-size:13px;color:var(--ink-soft);">
              <span style="flex-shrink:0;font-weight:700;color:var(--gold-deep);">${items.length - i}.</span>
              <span style="flex-shrink:0;background:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;color:var(--ink);">${esc(h.unit ? `${h.subject} ${h.unit}` : h.subject)}${h.page ? ` ${esc(h.page)}쪽` : ""}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(h.preview)}</span>
            </div>`).join("")}
        </div>
      </div>`;
  }

  app.innerHTML = `<div class="center-screen"><div class="spinner spin"></div></div>`;

  const settingsRef = doc(db, COLLECTIONS.SETTINGS, ownerId);
  const unsub = onSnapshot(settingsRef, (snap) => {
    const isOpen = snap.exists() ? snap.data().isSubmissionOpen !== false : true;
    const remoteSubjects = snap.exists() ? snap.data().subjects : null;
    if (Array.isArray(remoteSubjects) && remoteSubjects.length > 0) SUBJECTS = remoteSubjects;
    const remoteClasses = snap.exists() ? snap.data().classes : null;
    if (Array.isArray(remoteClasses) && remoteClasses.length > 0) CLASSES = remoteClasses;
    applyUnitSettings(snap.exists() ? snap.data() : null);
    practiceOpen = snap.exists() ? snap.data().isPracticeOpen === true : false;
    maxPerStudent = snap.exists() ? Math.max(0, Number(snap.data().maxPerStudent) || 0) : 0;
    // 선생님이 참여 코드만 바꾼 경우 등, 학생 화면에 영향이 없으면 다시 그리지 않음 (입력 중 커서 유지)
    const key = JSON.stringify([isOpen, practiceOpen, maxPerStudent, SUBJECTS, CLASSES, GRADE_TERM, UNITS[GRADE_TERM] || null]);
    if (key === lastPaintKey) return;
    lastPaintKey = key;
    paint(isOpen);
  }, () => { if (lastPaintKey === null) { lastPaintKey = "err"; paint(true); } });
  registerCleanup(unsub);

  function paint(submissionOpen) {
    if (!submissionOpen) {
      app.innerHTML = `<div class="center-screen"><div class="fade-in" style="text-align:center;max-width:340px;">
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
          <a href="#/admin" class="btn btn-ghost" style="padding:8px 14px;font-size:12px;font-weight:700;">관리자 화면</a>
        </div>
        <div class="gate-bell">${BELL_SVG}</div>
        <h1 style="font-size:19px;font-weight:800;">현재 문제 접수가 종료되었습니다.</h1>
        <p style="color:var(--ink-soft);margin-top:8px;">선생님께서 접수를 다시 열면 이용하실 수 있어요.</p>
        ${practiceLink()}
      </div></div>`;
      return;
    }
    app.innerHTML = `
      <div class="student-wrap">
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
          <a href="#/admin" class="btn btn-ghost" style="padding:7px 12px;font-size:12px;font-weight:700;">관리자 화면</a>
        </div>
        <div class="brand">${BELL_SVG}학교 골든벨</div>
        <p class="brand-sub">우리가 낸 문제로 골든벨을 열어요. 여러 문제를 내도 됩니다.</p>
        <div class="dots" id="dots"></div>
        <div class="card" id="step-container"></div>
        ${practiceLink()}
      </div>`;
    paintDots();
    paintStep();
  }

  function paintDots() {
    const order = ["info", "question", "success"];
    const idx = order.indexOf(step);
    document.getElementById("dots").innerHTML = order.map((s, i) => {
      const cls = step === s ? "current" : i < idx ? "done" : "";
      return `<div class="dot ${cls}"></div>`;
    }).join("");
  }

  function paintStep() {
    const el = document.getElementById("step-container");
    if (step === "info") el.innerHTML = infoStepHTML();
    else if (step === "question") el.innerHTML = questionStepHTML();
    else el.innerHTML = successStepHTML();
    bindStepEvents();
  }

  function infoStepHTML() {
    return `
      <div class="fade-in" style="display:flex;flex-direction:column;gap:20px;">
        <div>
          <label class="label">반</label>
          <div class="grid3">
            ${CLASSES.map((c) => `<button type="button" class="pill-btn ${studentInfo.studentClass === c ? "active" : ""}" data-class="${esc(c)}">${esc(c)}</button>`).join("")}
          </div>
        </div>
        <div>
          <label class="label">번호</label>
          <input class="input" type="number" inputmode="numeric" id="num-input" placeholder="번호를 입력하세요" value="${esc(studentInfo.number)}">
        </div>
        <div>
          <label class="label">이름</label>
          <input class="input" type="text" id="name-input" placeholder="이름을 입력하세요" value="${esc(studentInfo.name)}">
        </div>
        ${error ? `<p class="error-box">${esc(error)}</p>` : ""}
        <button class="btn btn-gold" id="next-btn" style="width:100%;">다음</button>
      </div>`;
  }

  function questionStepHTML() {
    const isMultiple = draft.type === QUESTION_TYPES.MULTIPLE;
    const doneCount = myHistory().length;
    const units = unitsFor(draft.subject);
    return `
      <div class="fade-in" style="display:flex;flex-direction:column;gap:16px;">
        <div class="who-row">
          <span class="who-chip">${esc(studentInfo.studentClass)} ${esc(studentInfo.number)}번 ${esc(studentInfo.name)}</span>
          <span class="count-chip ${doneCount ? "on" : ""}">${doneCount ? `${doneCount + 1}번째 문제` : "첫 번째 문제"}${remainingCount() !== null ? `, ${remainingCount()}개 더 낼 수 있음` : ""}</span>
        </div>

        <div class="q-section">
          <p class="q-section-title"><span class="q-step">1</span>어디에서 낸 문제인가요?</p>
          <div>
            <label class="label">과목</label>
            <div class="grid4">
              ${SUBJECTS.map((s) => `<button type="button" class="pill-btn subj-btn ${draft.subject === s ? "active" : ""}" data-subject="${esc(s)}">${esc(s)}</button>`).join("")}
            </div>
          </div>
          ${units.length ? `
          <div>
            <label class="label">단원 <span style="font-weight:600;font-size:12px;color:var(--ink-soft);">(${esc(gradeTermLabel(GRADE_TERM))})</span></label>
            <select class="input" id="unit-select">
              <option value="">단원을 골라주세요</option>
              ${units.map((u) => `<option value="${esc(u)}" ${draft.unit === u ? "selected" : ""}>${esc(u)}</option>`).join("")}
            </select>
          </div>` : ""}
          <div>
            <label class="label">교과서 쪽수</label>
            <div style="display:flex;align-items:center;gap:8px;">
              <input class="input" type="text" inputmode="numeric" id="page-input" placeholder="예: 45 또는 45~46" maxlength="9" value="${esc(draft.page)}" ${draft.noPage ? "disabled" : ""} style="flex:1;${draft.noPage ? "opacity:.45;" : ""}">
              <span style="font-weight:700;color:var(--ink-soft);">쪽</span>
            </div>
            <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;">
              <input type="checkbox" id="no-page-check" ${draft.noPage ? "checked" : ""} style="accent-color:var(--gold);width:16px;height:16px;">
              교과서에 없는 내용이에요
            </label>
          </div>
        </div>

        <div class="q-section">
          <p class="q-section-title"><span class="q-step">2</span>문제를 만들어요</p>
          <div class="seg">
            ${Object.values(QUESTION_TYPES).map((t) => `
              <label class="seg-btn type-radio ${draft.type === t ? "active" : ""}">
                <input type="radio" name="qtype" value="${t}" ${draft.type === t ? "checked" : ""}>
                ${t === QUESTION_TYPES.MULTIPLE ? "" : ""}${t}
              </label>`).join("")}
          </div>
          <div>
            <label class="label">문제</label>
            <textarea class="input" id="q-input" rows="3" placeholder="문제를 입력하세요" style="resize:vertical;">${esc(draft.question)}</textarea>
          </div>
          ${isMultiple ? `
          <div>
            <label class="label">보기 <span style="font-weight:600;font-size:12px;color:var(--ink-soft);">— 정답 보기의 번호를 눌러 표시해요</span></label>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${Array.from({ length: CHOICE_COUNT }).map((_, i) => `
                <div class="choice-row">
                  <button type="button" class="choice-mark correct-btn ${draft.correctChoice === String(i + 1) ? "active" : ""}" data-idx="${i + 1}" title="${i + 1}번을 정답으로">${i + 1}</button>
                  <input class="input choice-input" data-idx="${i}" type="text" placeholder="보기 ${i + 1}" value="${esc(draft.choices[i] || "")}">
                </div>`).join("")}
            </div>
          </div>` : ""}
          <div>
            <label class="label">${isMultiple ? "정답 설명 (선택)" : "모범 답안"}</label>
            <textarea class="input" id="a-input" rows="2" placeholder="${isMultiple ? "비워 두면 고른 정답 보기가 자동으로 들어가요" : "모범 답안을 입력하세요"}" style="resize:vertical;">${esc(draft.answer)}</textarea>
          </div>
          ${isMultiple ? "" : `
          <div>
            <label class="label">정답으로 인정할 답</label>
            <p style="font-size:13px;color:var(--ink-soft);margin:-2px 0 8px;line-height:1.5;">모범 답안과 뜻이 같은 다른 표현을 한 줄에 하나씩 적어요. 예) 세종, 세종 대왕, 이도</p>
            <textarea class="input" id="acc-input" rows="3" placeholder="한 줄에 하나씩" ${draft.noAccepted ? "disabled" : ""} style="resize:vertical;${draft.noAccepted ? "opacity:.45;" : ""}">${esc(draft.accepted)}</textarea>
            <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;">
              <input type="checkbox" id="no-acc-check" ${draft.noAccepted ? "checked" : ""} style="accent-color:var(--board);width:16px;height:16px;">
              모범 답안만 정답이에요 (다른 답은 인정하지 않아요)
            </label>
          </div>`}
        </div>

        ${error ? `<p class="error-box fade-in">${esc(error)}</p>` : ""}
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" id="prev-btn" style="flex:1;">이전</button>
          <button class="btn btn-gold" id="submit-btn" style="flex:2;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;" ${submitting ? "disabled" : ""}>
            ${submitting ? `<span class="spinner spin" style="width:16px;height:16px;border-width:2px;"></span>` : ""}
            ${submitting ? "제출 중..." : "제출하기 "}
          </button>
        </div>
      </div>`;
  }


  function successStepHTML() {
    if (!lastSubmitted) return "";
    const items = myHistory();
    const reachedMax = remainingCount() === 0;
    return `
      <div class="pop" style="text-align:center;padding:14px 0;">
        <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:99px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:30px;"></div>
        <h2 style="font-size:18px;font-weight:800;">${items.length > 1 ? `${items.length}번째 문제가 등록되었습니다!` : "문제가 성공적으로 등록되었습니다!"}</h2>
        <p style="font-size:13px;color:var(--ink-soft);margin-top:6px;">${esc(lastSubmitted.subject)}, ${lastSubmitted.submittedAt.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" })} 제출</p>
        ${historyListHTML(items)}
        ${reachedMax ? `<p style="margin-top:14px;font-size:13px;font-weight:700;color:#7E5C0E;background:#F5E7BC;border-radius:12px;padding:10px 12px;">한 사람당 ${maxPerStudent}개까지 낼 수 있어요. 모두 냈어요! </p>` : ""}
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">
          ${reachedMax ? "" : `
          <button class="btn btn-gold" id="another-same-btn" style="width:100%;">${esc(lastSubmitted.subject)} 문제 하나 더 내기</button>
          <button class="btn btn-ghost" id="another-btn" style="width:100%;">다른 과목 문제 내기</button>`}
          <button class="btn btn-ghost" id="change-student-btn" style="width:100%;font-size:13px;padding:10px;background:none;color:var(--ink-soft);">다른 학생으로 바꾸기</button>
        </div>
      </div>`;
  }

  function bindStepEvents() {
    if (step === "info") {
      document.querySelectorAll("[data-class]").forEach((b) => b.onclick = () => {
        studentInfo.studentClass = b.dataset.class; saveJSON(infoKey, studentInfo);
        document.querySelectorAll("[data-class]").forEach((x) => x.classList.toggle("active", x === b));
      });
      document.getElementById("num-input").oninput = (e) => { studentInfo.number = e.target.value; saveJSON(infoKey, studentInfo); };
      document.getElementById("name-input").oninput = (e) => { studentInfo.name = e.target.value; saveJSON(infoKey, studentInfo); };
      document.getElementById("next-btn").onclick = () => {
        const result = validateStudentInfo(studentInfo);
        if (!result.valid) { error = result.message; paintStep(); return; }
        error = ""; step = "question"; paintDots(); paintStep();
        if (maxPerStudent > 0) refreshServerCount().then(() => { if (step === "question") paintStep(); });
      };
    } else if (step === "question") {
      document.querySelectorAll(".subj-btn").forEach((b) => b.onclick = () => {
        if (draft.subject === b.dataset.subject) return;
        draft.subject = b.dataset.subject;
        if (!unitsFor(draft.subject).includes(draft.unit)) draft.unit = "";
        saveJSON(draftKey, draft);
        paintStep(); // 과목에 맞는 단원 목록을 보여주기 위해 다시 그림
      });
      const unitSel = document.getElementById("unit-select");
      if (unitSel) unitSel.onchange = (e) => { draft.unit = e.target.value; saveJSON(draftKey, draft); };
      document.querySelectorAll('input[name="qtype"]').forEach((r) => r.onchange = () => {
        // 유형을 실수로 바꿔도 입력한 보기는 지워지지 않도록 유지 (제출 시 객관식일 때만 사용)
        draft.type = r.value;
        saveJSON(draftKey, draft); error = ""; paintStep();
      });
      document.getElementById("page-input").oninput = (e) => { draft.page = e.target.value; saveJSON(draftKey, draft); };
      document.getElementById("no-page-check").onchange = (e) => {
        draft.noPage = e.target.checked; saveJSON(draftKey, draft);
        const inp = document.getElementById("page-input");
        inp.disabled = draft.noPage; inp.style.opacity = draft.noPage ? ".45" : "1";
      };
      document.getElementById("q-input").oninput = (e) => { draft.question = e.target.value; saveJSON(draftKey, draft); };
      document.getElementById("a-input").oninput = (e) => { draft.answer = e.target.value; saveJSON(draftKey, draft); };
      const accInput = document.getElementById("acc-input");
      if (accInput) accInput.oninput = (e) => { draft.accepted = e.target.value; saveJSON(draftKey, draft); };
      const noAcc = document.getElementById("no-acc-check");
      if (noAcc) noAcc.onchange = (e) => {
        draft.noAccepted = e.target.checked; saveJSON(draftKey, draft);
        accInput.disabled = draft.noAccepted; accInput.style.opacity = draft.noAccepted ? ".45" : "1";
      };
      document.querySelectorAll(".choice-input").forEach((inp) => inp.oninput = (e) => {
        draft.choices[Number(inp.dataset.idx)] = e.target.value; saveJSON(draftKey, draft);
      });
      document.querySelectorAll(".correct-btn").forEach((b) => b.onclick = () => {
        draft.correctChoice = b.dataset.idx; saveJSON(draftKey, draft);
        document.querySelectorAll(".correct-btn").forEach((x) => x.classList.toggle("active", x === b));
      });
      document.getElementById("prev-btn").onclick = () => { step = "info"; paintDots(); paintStep(); };
      document.getElementById("submit-btn").onclick = handleSubmit;
    } else if (step === "success") {
      const sameBtn = document.getElementById("another-same-btn");
      if (sameBtn) sameBtn.onclick = () => {
        draft = { ...emptyQuestion(), subject: lastSubmitted.subject, unit: lastSubmitted.unit || "", type: lastSubmitted.type };
        step = "question"; error = ""; paintDots(); paintStep();
        document.getElementById("q-input")?.focus();
      };
      const otherBtn = document.getElementById("another-btn");
      if (otherBtn) otherBtn.onclick = () => {
        draft = { ...emptyQuestion(), type: lastSubmitted.type };
        step = "question"; error = ""; paintDots(); paintStep();
      };
      // 교실 공용 기기에서 여러 학생이 번갈아 낼 때
      document.getElementById("change-student-btn").onclick = () => {
        studentInfo = { studentClass: studentInfo.studentClass, number: "", name: "" };
        saveJSON(infoKey, studentInfo);
        draft = emptyQuestion(); removeKey(draftKey);
        lastSubmitted = null; serverCount = null;
        step = "info"; error = ""; paintDots(); paintStep();
      };
    }
  }

  async function handleSubmit() {
    if (submitting) return;
    if (!draft.subject || !SUBJECTS.includes(draft.subject)) { error = "과목을 선택해주세요."; paintStep(); return; }
    const unitList = unitsFor(draft.subject);
    const unit = unitList.includes(draft.unit) ? draft.unit : "";
    if (unitList.length && !unit) { error = "몇 단원 내용인지 골라주세요."; paintStep(); return; }
    const page = draft.noPage ? "" : normalizePage(draft.page);
    if (!draft.noPage) {
      if (!page) { error = "교과서 몇 쪽에 있는 내용인지 적어주세요. (교과서에 없으면 아래 칸을 체크)"; paintStep(); return; }
      if (!PAGE_PATTERN.test(page)) { error = "쪽수는 숫자로 적어주세요. 예: 45 또는 45~46"; paintStep(); return; }
    }
    const infoCheck = validateStudentInfo(studentInfo);
    if (!infoCheck.valid) { error = infoCheck.message; step = "info"; paintDots(); paintStep(); return; }
    const result = validateQuestion(draft);
    if (!result.valid) { error = result.message; paintStep(); return; }

    const isMultiple = draft.type === QUESTION_TYPES.MULTIPLE;
    const choices = isMultiple ? draft.choices.map((c) => c.trim()) : [];
    const answer = draft.answer.trim() || (isMultiple ? choices[Number(draft.correctChoice) - 1] : "");
    const acceptedAnswers = isMultiple || draft.noAccepted ? [] : parseAccepted(draft.accepted).filter((x) => normAnswer(x) !== normAnswer(answer));
    if (!isMultiple && !draft.noAccepted && acceptedAnswers.length === 0) {
      error = "정답으로 인정할 다른 답을 적거나, '모범 답안만 정답이에요'에 체크해 주세요."; paintStep(); return;
    }
    if (acceptedAnswers.some((x) => containsBadWord(x))) { error = "인정할 답에 부적절한 단어가 있어요."; paintStep(); return; }

    submitting = true; error = ""; paintStep();
    try {
      // 학생별 제출 횟수를 1 올리면서 문제를 함께 저장 (최대 개수 제한은 Firestore 규칙에서도 확인)
      const countKey = submitCountKey(ownerId, studentInfo);
      const before = await refreshServerCount();
      if (before === null) throw new Error("count-read-failed");
      if (maxPerStudent > 0 && before >= maxPerStudent) {
        submitting = false;
        error = `한 사람이 낼 수 있는 문제는 ${maxPerStudent}개까지예요. 이미 ${before}개를 냈어요.`;
        paintStep(); return;
      }
      const batch = writeBatch(db);
      batch.set(doc(collection(db, COLLECTIONS.QUESTIONS)), {
        ownerId, countKey,
        class: studentInfo.studentClass, number: String(Number(studentInfo.number)), name: studentInfo.name.trim(),
        subject: draft.subject, gradeTerm: GRADE_TERM, unit, page, type: draft.type, question: draft.question.trim(), answer, acceptedAnswers,
        choices,
        correctChoice: draft.type === QUESTION_TYPES.MULTIPLE ? draft.correctChoice : "",
        createdAt: serverTimestamp(), isApproved: false, isDeleted: false,
      });
      batch.set(doc(db, COLLECTIONS.SUBMIT_COUNTS, countKey), { ownerId, count: before + 1 });
      await batch.commit();
      serverCount = before + 1;
      const qText = draft.question.trim();
      lastSubmitted = { subject: draft.subject, unit, type: draft.type, questionPreview: qText.length > 30 ? qText.slice(0, 30) + "..." : qText, submittedAt: new Date() };
      addHistory({ subject: draft.subject, unit, page, preview: lastSubmitted.questionPreview, at: Date.now() });
      removeKey(draftKey);
      draft = { ...emptyQuestion(), subject: draft.subject, type: draft.type };
      submitting = false;
      step = "success";
      paintDots(); paintStep();
    } catch (err) {
      console.error("Firestore 저장 오류:", err);
      // submitting을 먼저 풀어야 버튼이 '제출 중...'으로 멈추지 않음
      submitting = false;
      error = err && err.code === "permission-denied"
        ? (maxPerStudent > 0 ? `제출할 수 없어요. 한 사람당 ${maxPerStudent}개까지 낼 수 있어요.` : "제출할 수 없어요. 선생님께 문의해주세요.")
        : "제출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
      paintStep();
    }
  }
}

/* =========================================================================
   학생 연습 모드 (#/o/{ownerId}/practice)
   - 승인된 문제 + CSV로 가져온 연습 문제를 학생이 혼자 풀어 봄
   ========================================================================= */
// 연습 문제로 공개할 범위: imported(가져온 연습 문제) | approved(승인된 우리 반 문제) | both
const PRACTICE_SCOPES = { imported: "가져온 연습 문제만", both: "가져온 문제 + 승인된 우리 반 문제", approved: "승인된 우리 반 문제만" };
// classes: 공개할 반 목록 (비어 있으면 모든 반). 반 필터는 우리 반 학생이 낸 문제에만 적용하고, 가져온 연습 문제는 그대로 포함
function isPracticeQuestion(q, scope = "both", classes = []) {
  if (q.isDeleted) return false;
  if (classes.length && !q.isImported && !classes.includes(q.class)) return false;
  if (scope === "imported") return !!q.isImported;
  if (scope === "approved") return !!q.isApproved;
  return !!(q.isApproved || q.isImported);
}
// 학생에게 공개되는 연습 문제에는 출제자 이름 등은 넣지 않음
function toPracticeItem(q) {
  return {
    id: q.id, subject: q.subject || "", unit: q.unit || "", page: q.page || "", type: q.type,
    question: q.question || "", answer: q.answer || "", acceptedAnswers: acceptedList(q), choices: q.choices || [], correctChoice: q.correctChoice || "",
  };
}
function hashString(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h >>> 0); }

function renderPracticePage(ownerId) {
  let open = null;          // 선생님이 연습 모드를 켰는지
  let pool = null;          // 연습 가능한 문제 전체
  let loadError = "";
  let phase = "setup";      // setup | play | result
  const opt = { subject: "", unit: "", count: 10 };
  let set = [], idx = 0, picked = null, revealed = false, results = [], myEssay = "";

  app.innerHTML = `<div class="center-screen"><div class="spinner spin"></div></div>`;

  const unsub = onSnapshot(doc(db, COLLECTIONS.SETTINGS, ownerId), (snap) => {
    const nowOpen = snap.exists() ? snap.data().isPracticeOpen === true : false;
    const changed = nowOpen !== open;
    open = nowOpen;
    if (open && changed) { pool = null; loadPool(); }
    if (changed) paint();
  }, () => { open = false; paint(); });
  registerCleanup(unsub);

  async function loadPool() {
    try {
      // 학생은 문제 원본을 읽을 수 없고, 선생님이 연습용으로 공개한 묶음만 읽음
      const snap = await getDoc(doc(db, COLLECTIONS.PRACTICE_SETS, ownerId));
      pool = snap.exists() && Array.isArray(snap.data().items) ? snap.data().items : [];
    } catch (err) {
      console.error(err); pool = []; loadError = "문제를 불러오지 못했어요. 잠시 후 다시 시도해주세요.";
    }
    paint();
  }

  const backLink = `<a href="#/o/${ownerId}" class="btn btn-ghost" style="padding:8px 14px;font-size:12px;font-weight:700;">문제 내러 가기</a>`;
  function shell(inner) {
    return `<div class="student-wrap">
      <div style="display:flex;justify-content:flex-start;margin-bottom:12px;">${backLink}</div>
      <div class="brand">${BELL_SVG}골든벨 연습</div>
      <p class="brand-sub">친구들이 낸 문제를 미리 풀어 봅니다.</p>
      ${inner}
    </div>`;
  }

  function filteredPool() {
    return (pool || []).filter((q) => (!opt.subject || q.subject === opt.subject) && (!opt.unit || q.unit === opt.unit));
  }

  function paint() {
    if (open === null) return;
    if (!open) {
      app.innerHTML = `<div class="center-screen"><div class="fade-in" style="text-align:center;max-width:340px;">
        <div class="gate-bell">${BELL_SVG}</div>
        <h1 style="font-size:19px;font-weight:800;">지금은 연습 모드가 꺼져 있어요.</h1>
        <p style="color:var(--ink-soft);margin-top:8px;">선생님께서 연습 모드를 켜면 이용할 수 있어요.</p>
        <div style="margin-top:16px;">${backLink}</div>
      </div></div>`;
      return;
    }
    if (pool === null) { app.innerHTML = `<div class="center-screen"><div class="spinner spin"></div></div>`; return; }
    if (phase === "setup") paintSetup();
    else if (phase === "play") paintPlay();
    else paintResult();
  }

  function paintSetup() {
    if (loadError || pool.length === 0) {
      app.innerHTML = shell(`<div class="card fade-in" style="text-align:center;color:var(--ink-soft);">${esc(loadError || "아직 연습할 수 있는 문제가 없어요.")}</div>`);
      return;
    }
    const subjects = [...new Set(pool.map((q) => q.subject))];
    if (opt.subject && !subjects.includes(opt.subject)) { opt.subject = ""; opt.unit = ""; }
    const units = [...new Set(pool.filter((q) => q.subject === opt.subject && q.unit).map((q) => q.unit))]
      .sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
    const available = filteredPool().length;
    app.innerHTML = shell(`
      <div class="card fade-in" style="display:flex;flex-direction:column;gap:18px;">
        <div>
          <label class="label">과목</label>
          <div class="grid3">
            <button type="button" class="pill-btn ${!opt.subject ? "active" : ""}" data-psubject="">전체</button>
            ${subjects.map((s) => `<button type="button" class="pill-btn ${opt.subject === s ? "active" : ""}" data-psubject="${esc(s)}">${esc(s)}</button>`).join("")}
          </div>
        </div>
        ${opt.subject && units.length ? `
        <div>
          <label class="label">단원</label>
          <select class="input" id="p-unit">
            <option value="">전체 단원</option>
            ${units.map((u) => `<option value="${esc(u)}" ${opt.unit === u ? "selected" : ""}>${esc(u)}</option>`).join("")}
          </select>
        </div>` : ""}
        <div>
          <label class="label">문항 수</label>
          <div class="grid4">
            ${[5, 10, 20, 0].map((n) => `<button type="button" class="pill-btn ${opt.count === n ? "active" : ""}" data-pcount="${n}">${n ? `${n}문항` : "전부"}</button>`).join("")}
          </div>
        </div>
        <p style="font-size:13px;color:var(--ink-soft);margin:0;text-align:center;">풀 수 있는 문제 <b style="color:var(--ink);">${available}개</b></p>
        <button class="btn btn-gold" id="p-start" style="width:100%;" ${available ? "" : "disabled"}>연습 시작하기</button>
      </div>`);
    document.querySelectorAll("[data-psubject]").forEach((b) => b.onclick = () => { opt.subject = b.dataset.psubject; opt.unit = ""; paintSetup(); });
    document.querySelectorAll("[data-pcount]").forEach((b) => b.onclick = () => { opt.count = Number(b.dataset.pcount); paintSetup(); });
    const unitSel = document.getElementById("p-unit");
    if (unitSel) unitSel.onchange = (e) => { opt.unit = e.target.value; paintSetup(); };
    document.getElementById("p-start").onclick = () => startSet(shuffle(filteredPool()));
  }

  function startSet(list) {
    set = opt.count ? list.slice(0, opt.count) : list;
    if (set.length === 0) return;
    idx = 0; picked = null; revealed = false; results = []; myEssay = "";
    phase = "play"; paint(); window.scrollTo(0, 0);
  }

  function paintPlay() {
    const q = set[idx];
    const isMultiple = q.type === QUESTION_TYPES.MULTIPLE;
    const correct = String(q.correctChoice || "");
    const done = picked !== null || (revealed && !isMultiple && results[idx] !== undefined);
    const score = results.filter(Boolean).length;
    app.innerHTML = shell(`
      <div class="bar-track" style="margin-bottom:16px;height:8px;"><div class="bar-fill" style="width:${((idx + 1) / set.length) * 100}%;"></div></div>
      <div class="card fade-in" style="display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="p-tag">${esc(subjectWithUnit(q))}</span>
          <span style="font-size:13px;font-weight:800;color:var(--ink-soft);">${idx + 1} / ${set.length} <span style="color:var(--red);margin-left:8px;">맞힘 ${score}</span></span>
        </div>
        <p class="p-question">${esc(q.question)}</p>
        ${isMultiple ? `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${(q.choices || []).map((c, i) => {
              const n = String(i + 1);
              let style = "";
              if (picked !== null) {
                if (n === correct) style = "background:var(--green-soft);border-color:var(--green);color:var(--green);";
                else if (n === picked) style = "background:var(--red-soft);border-color:var(--red);color:var(--red);";
              }
              return `<button type="button" class="p-choice" data-n="${n}" style="${style}" ${picked !== null ? "disabled" : ""}>
                <span class="choice-idx">${n}</span><span style="flex:1;">${esc(c)}</span>
                ${picked !== null && n === correct ? `<span class="pen-mark">○</span>` : picked === n ? `<span class="pen-mark">／</span>` : ""}
              </button>`;
            }).join("")}
          </div>` : `
          ${!revealed ? `
            <textarea class="input" id="p-essay" rows="3" placeholder="내 답을 먼저 써 보세요 (선택)" style="resize:vertical;"></textarea>
            <button class="btn btn-dark" id="p-reveal" style="width:100%;">정답 확인하기</button>` : `
            ${myEssay ? `<p style="margin:0;font-size:14px;color:var(--ink-soft);">내 답: <b style="color:var(--ink);">${esc(myEssay)}</b></p>` : ""}
            <div style="background:var(--gold-soft);border-radius:10px;padding:14px 16px;">
              <p style="font-size:12px;font-weight:800;color:var(--gold-deep);margin:0 0 4px;">모범 답안</p>
              <p style="font-size:16px;font-weight:700;white-space:pre-wrap;margin:0;">${esc(q.answer)}</p>
              ${acceptedList(q).length ? `<p style="font-size:14px;margin:8px 0 0;color:var(--ink);"><span style="color:var(--gold-deep);font-weight:800;">이것도 정답</span> ${acceptedList(q).map(esc).join(", ")}</p>` : ""}
            </div>
            ${results[idx] === undefined ? `
            <p style="font-size:13px;color:var(--ink-soft);text-align:center;margin:0;">내 답과 비교해 보고 스스로 채점해요.</p>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-green" id="p-self-o" style="flex:1;">맞았어요</button>
              <button class="btn btn-red" id="p-self-x" style="flex:1;">틀렸어요</button>
            </div>` : ""}`}`}
        ${done ? `
          <div class="fade-in" style="border-radius:14px;padding:12px 14px;background:${results[idx] ? "var(--green-soft)" : "var(--red-soft)"};color:${results[idx] ? "var(--green)" : "var(--red)"};font-weight:700;font-size:14px;">
            ${results[idx] ? "정답이에요! " : `아쉬워요!${isMultiple ? ` 정답은 ${esc(correct)}번이에요.` : ""}`}
            ${isMultiple && q.answer && q.answer !== (q.choices || [])[Number(correct) - 1] ? `<div style="font-weight:600;color:var(--ink);margin-top:6px;white-space:pre-wrap;">${esc(q.answer)}</div>` : ""}
            ${q.page ? `<div style="font-weight:600;color:var(--ink-soft);margin-top:4px;">${esc(pageText(q))}${results[idx] ? "" : "을 다시 읽어 보세요."}</div>` : ""}
          </div>
          <button class="btn btn-gold" id="p-next" style="width:100%;">${idx === set.length - 1 ? "결과 보기" : "다음 문제"}</button>` : ""}
      </div>`);
    document.querySelectorAll(".p-choice").forEach((b) => b.onclick = () => {
      if (picked !== null) return;
      picked = b.dataset.n; results[idx] = picked === correct; paintPlay();
    });
    const rv = document.getElementById("p-reveal");
    if (rv) rv.onclick = () => {
      myEssay = (document.getElementById("p-essay")?.value || "").trim();
      revealed = true;
      // 쓴 답이 모범 답안이나 인정 답과 같으면 바로 정답 처리 (아니면 스스로 채점)
      if (myEssay && [q.answer, ...acceptedList(q)].some((a) => normAnswer(a) && normAnswer(a) === normAnswer(myEssay))) results[idx] = true;
      paintPlay();
    };
    const so = document.getElementById("p-self-o");
    if (so) so.onclick = () => { results[idx] = true; paintPlay(); };
    const sx = document.getElementById("p-self-x");
    if (sx) sx.onclick = () => { results[idx] = false; paintPlay(); };
    const nx = document.getElementById("p-next");
    if (nx) nx.onclick = () => {
      if (idx === set.length - 1) { phase = "result"; paint(); window.scrollTo(0, 0); return; }
      idx += 1; picked = null; revealed = false; myEssay = ""; paintPlay(); window.scrollTo(0, 0);
    };
  }

  function paintResult() {
    const score = results.filter(Boolean).length;
    const wrong = set.filter((_, i) => !results[i]);
    const pct = Math.round((score / set.length) * 100);
    app.innerHTML = shell(`
      <div class="card pop" style="text-align:center;">
        <div class="score-big">${score}<small>/${set.length}</small></div>
        <h2 style="font-size:20px;font-weight:800;margin:8px 0 4px;">${set.length}문제 중 ${score}문제를 맞혔어요</h2>
        <p style="color:var(--ink-soft);font-size:14px;margin:0;">${pct === 100 ? "완벽해요! 골든벨 준비 끝!" : pct >= 70 ? "잘했어요! 틀린 문제만 한 번 더 보면 완벽해요." : "틀린 문제를 다시 풀어 보며 실력을 키워요."}</p>
        ${wrong.length ? `
        <div style="margin-top:18px;text-align:left;background:var(--cream);border-radius:14px;padding:14px 16px;">
          <p style="font-size:13px;font-weight:800;margin:0 0 10px;">틀린 문제 ${wrong.length}개</p>
          <div style="display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;">
            ${wrong.map((q) => `
              <div style="font-size:13px;line-height:1.5;">
                <div style="font-weight:700;color:var(--ink);white-space:pre-wrap;">${esc(q.question)}</div>
                <div style="color:var(--green);font-weight:700;">정답: ${q.type === QUESTION_TYPES.MULTIPLE ? `${esc(q.correctChoice)}번 ${esc((q.choices || [])[Number(q.correctChoice) - 1] || "")}` : esc([q.answer, ...acceptedList(q)].join(", "))}</div>
                ${q.page ? `<div style="color:var(--ink-soft);">${esc(pageText(q))}</div>` : ""}
              </div>`).join("")}
          </div>
        </div>` : ""}
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">
          ${wrong.length ? `<button class="btn btn-gold" id="p-retry" style="width:100%;">틀린 문제 다시 풀기</button>` : ""}
          <button class="btn ${wrong.length ? "btn-ghost" : "btn-gold"}" id="p-again" style="width:100%;">새로 연습하기</button>
        </div>
      </div>`);
    const retry = document.getElementById("p-retry");
    if (retry) retry.onclick = () => { const c = opt.count; opt.count = 0; startSet(shuffle(wrong)); opt.count = c; };
    document.getElementById("p-again").onclick = () => { phase = "setup"; paint(); };
  }
}

const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });
const GOOGLE_SILENT_CODES = ["auth/popup-closed-by-user", "auth/cancelled-popup-request"];
async function startGoogleLogin(showErr) {
  await persistenceReady;
  authBusy = true;
  try {
    const cred = await signInWithPopup(auth, googleProvider);
    currentOwner = await resolveOwner(cred.user);
  } catch (e) {
    authBusy = false;

  authBusy = false;
  if (currentOwner) sessionStorage.removeItem(ADMIN_USER_KEY);
  render();
}

// 구글로 처음 들어온 선생님: 학생 주소·참여 코드에 쓰일 아이디와 가입 코드를 한 번만 정함
function renderGoogleSetup() {
  const user = auth.currentUser;
  let submitting = false, errMsg = "", idVal = "", codeVal = "", inviteVal = "", joinErr = "";
  function paint() {
    app.innerHTML = `
      <div class="center-screen">
        <div class="card fade-in" style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;">
          <h1 style="font-size:18px;font-weight:800;text-align:center;">구글 계정으로 처음 오셨네요</h1>
          <p style="font-size:13px;color:var(--ink-soft);margin:0;text-align:center;line-height:1.5;"><b style="color:var(--ink);">${esc(user.email || "구글 계정")}</b><br>학생 접속 주소에 쓰일 아이디와 가입 코드를 정해 주세요. (한 번만 하면 돼요)</p>
          <form id="gs-form" style="display:flex;flex-direction:column;gap:12px;">
            <div><label class="label" style="font-size:13px;">아이디 (영문+숫자 4~20자)</label><input class="input" id="gs-id" value="${esc(idVal)}" autocomplete="off"></div>
            <div><label class="label" style="font-size:13px;">가입 코드</label><input class="input" id="gs-code" value="${esc(codeVal)}" placeholder="관리 선생님께 받은 가입 코드" autocomplete="off"></div>
            ${errMsg ? `<p class="error-box">${esc(errMsg)}</p>` : ""}
            <button type="submit" class="btn btn-gold" ${submitting ? "disabled" : ""}>${submitting ? "처리 중..." : "시작하기"}</button>
          </form>
          <div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;">
            <p style="font-size:13px;font-weight:800;margin:0;">이미 있는 아이디에 합류하기</p>
            <p style="font-size:12px;color:var(--ink-soft);margin:0;line-height:1.5;">그 아이디의 '계정 관리'에서 만든 연결 코드를 넣으세요.</p>
            <form id="gs-join-form" style="display:flex;gap:8px;">
              <input class="input" id="gs-invite" value="${esc(inviteVal)}" placeholder="연결 코드 8자리" maxlength="10" autocomplete="off" style="flex:1;text-transform:uppercase;letter-spacing:.1em;font-weight:700;">
              <button type="submit" class="btn btn-dark" style="white-space:nowrap;padding:12px 14px;" ${submitting ? "disabled" : ""}>합류하기</button>
            </form>
            ${joinErr ? `<p class="error-box">${esc(joinErr)}</p>` : ""}
          </div>
          <button type="button" class="btn btn-ghost" id="gs-out" style="font-size:13px;">다른 계정으로 로그인</button>
        </div>
      </div>`;
    document.getElementById("gs-out").onclick = () => signOut(auth);
    document.getElementById("gs-join-form").onsubmit = async (e) => {
      e.preventDefault();
      if (submitting) return;
      inviteVal = document.getElementById("gs-invite").value.replace(/\s/g, "").toUpperCase();
      if (!inviteVal) { joinErr = "연결 코드를 입력해주세요."; return paint(); }
      submitting = true; joinErr = ""; paint();
      try {
        const inv = await getDoc(doc(db, COLLECTIONS.LINK_INVITES, inviteVal));
        const data = inv.exists() ? inv.data() : null;
        if (!data || !data.ownerId) { submitting = false; joinErr = "연결 코드를 찾을 수 없어요."; return paint(); }
        if (data.expiresAt?.toMillis && data.expiresAt.toMillis() < Date.now()) { submitting = false; joinErr = "기간이 지난 연결 코드예요. 새로 만들어 주세요."; return paint(); }
        const batch = writeBatch(db);
        batch.update(doc(db, COLLECTIONS.ADMINS, data.ownerId), { [`members.${user.uid}`]: user.email || "구글 계정", lastInviteCode: inviteVal });
        batch.set(doc(db, COLLECTIONS.ADMIN_UIDS, user.uid), { ownerId: data.ownerId });
        batch.delete(doc(db, COLLECTIONS.LINK_INVITES, inviteVal));
        await batch.commit();
        currentOwner = data.ownerId;
        sessionStorage.removeItem(ADMIN_USER_KEY);
        render();
      } catch (err) {
        console.error(err);
        submitting = false;
        joinErr = err.code === "permission-denied" ? "합류할 수 없어요. 코드가 맞는지, 기간이 지나지 않았는지 확인해주세요." : authErrorMessage(err);
        paint();
      }
    };
    document.getElementById("gs-form").onsubmit = async (e) => {
      e.preventDefault();
      if (submitting) return;
      idVal = document.getElementById("gs-id").value.trim();
      codeVal = document.getElementById("gs-code").value.trim();
      if (!ID_PATTERN.test(idVal) || idVal.length < 4 || idVal.length > 20) { errMsg = "아이디는 영문과 숫자만 사용해 4~20자로 입력해주세요."; return paint(); }
      if (!codeVal) { errMsg = "가입 코드를 입력해주세요."; return paint(); }
      const idKey = idVal.toLowerCase();
      const ref = doc(db, COLLECTIONS.ADMINS, idKey);
      submitting = true; errMsg = ""; paint();
      try {
        if (await adminIdTaken(ref)) { submitting = false; errMsg = "이미 사용 중인 아이디입니다."; return paint(); }
        const batch = writeBatch(db);
        batch.set(doc(db, COLLECTIONS.SIGNUP_CLAIMS, idKey), { code: codeVal, uid: user.uid });
        batch.set(ref, { id: idVal, uid: user.uid, createdAt: serverTimestamp() });
        batch.set(doc(db, COLLECTIONS.ADMIN_UIDS, user.uid), { ownerId: idKey });
        await batch.commit();
        currentOwner = idKey;
        sessionStorage.setItem(ADMIN_USER_KEY, idVal);
        render();
      } catch (err) {
        console.error(err);
        submitting = false;
        errMsg = err.code === "permission-denied" ? "가입 코드가 올바르지 않습니다." : authErrorMessage(err);
        paint();
      }
    };
  }
  paint();
}

// 다른 선생님 계정 문서는 읽을 수 없게 막혀 있으므로, '읽기 거부' = 이미 있는 아이디
async function adminIdTaken(ref) {
  try { const snap = await getDoc(ref); return snap.exists(); }
  catch (e) { if (e.code === "permission-denied") return true; throw e; }
}
const WRONG_PW_CODES = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials"];
function authErrorMessage(err) {
  switch (err && err.code) {
    case "auth/operation-not-allowed": return "Firebase 콘솔에서 이 로그인 방법(이메일/비밀번호 또는 Google)을 켜야 합니다. (Authentication → 로그인 방법)";
    case "auth/unauthorized-domain": return "이 사이트 주소가 Firebase 승인된 도메인에 없어요. (Authentication → 설정 → 승인된 도메인에 추가)";
    case "auth/popup-blocked": return "팝업이 차단됐어요. 브라우저에서 이 사이트의 팝업을 허용해 주세요.";
    case "auth/credential-already-in-use": return "이 구글 계정은 이미 다른 골든벨 계정에 연결되어 있어요.";
    case "auth/provider-already-linked": return "이미 구글 계정이 연결되어 있어요.";
    case "auth/too-many-requests": return "시도가 너무 많아요. 잠시 후 다시 시도해주세요.";
    case "auth/network-request-failed": return "인터넷 연결을 확인해주세요.";
    case "auth/weak-password": return "비밀번호는 6자 이상이어야 합니다.";
    case "permission-denied": return "권한 오류가 발생했어요. Firestore 규칙이 최신인지 확인해주세요.";
    default: return "처리 중 오류가 발생했습니다. 다시 시도해주세요.";
  }
}

function renderAuthGate() {
  let mode = "login"; // "login" | "signup"
  let submitting = false;
  let lastId = ""; // 오류로 다시 그려도 아이디는 남겨 둠

  function paint() {
    app.innerHTML = `
      <div class="center-screen">
        <div class="card fade-in" style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;">
          <h1 style="font-size:18px;font-weight:800;text-align:center;">${mode === "login" ? "관리자 로그인" : "관리자 회원가입"}</h1>
          <div class="grid3" style="grid-template-columns:1fr 1fr;">
            <button type="button" class="pill-btn ${mode === "login" ? "active" : ""}" id="tab-login">로그인</button>
            <button type="button" class="pill-btn ${mode === "signup" ? "active" : ""}" id="tab-signup">회원가입</button>
          </div>
          <form id="auth-form" style="display:flex;flex-direction:column;gap:12px;">
            <div>
              <label class="label" style="font-size:13px;margin-bottom:6px;">아이디 (영문+숫자)</label>
              <input class="input" type="text" id="auth-id" placeholder="영문, 숫자 4~20자" autocomplete="off" autofocus>
            </div>
            <div>
              <label class="label" style="font-size:13px;margin-bottom:6px;">비밀번호 (영문+숫자)</label>
              <input class="input" type="password" id="auth-pw" placeholder="영문, 숫자 6~20자" autocomplete="off">
            </div>
            ${mode === "signup" ? `
            <div>
              <label class="label" style="font-size:13px;margin-bottom:6px;">비밀번호 확인</label>
              <input class="input" type="password" id="auth-pw2" placeholder="비밀번호 다시 입력" autocomplete="off">
            </div>
            <div>
              <label class="label" style="font-size:13px;margin-bottom:6px;">가입 코드</label>
              <input class="input" type="text" id="auth-signup-code" placeholder="관리 선생님께 받은 가입 코드" autocomplete="off">
            </div>` : ""}
            <p class="error-box" id="auth-error" style="display:none;"></p>
            <button type="submit" class="btn btn-gold" style="width:100%;" ${submitting ? "disabled" : ""}>
              ${submitting ? "처리 중..." : mode === "login" ? "로그인" : "가입하고 시작하기"}
            </button>
          </form>
          <div style="display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:12px;"><div style="flex:1;height:1px;background:var(--line);"></div>또는<div style="flex:1;height:1px;background:var(--line);"></div></div>
          ${googleButtonHTML(mode === "login" ? "Google로 로그인" : "Google로 가입하기")}
          ${mode === "login" ? `<p style="font-size:12px;color:var(--ink-soft);margin:0;line-height:1.5;">비밀번호를 잊었다면 사이트 관리 선생님께 계정 초기화를 요청하세요. 같은 아이디로 다시 가입하면 문제와 설정은 그대로 있습니다.</p>` : ""}
        </div>
      </div>`;

    document.getElementById("tab-login").onclick = () => { if (mode !== "login") { mode = "login"; paint(); } };
    document.getElementById("tab-signup").onclick = () => { if (mode !== "signup") { mode = "signup"; paint(); } };

    const showErr = (msg) => {
      const el = document.getElementById("auth-error");
      if (el) { el.textContent = msg; el.style.display = "block"; }
    };

    const idInput = document.getElementById("auth-id");
    if (lastId) idInput.value = lastId;
    document.getElementById("google-btn").onclick = () => startGoogleLogin(showErr);

    document.getElementById("auth-form").onsubmit = async (e) => {
      e.preventDefault();
      if (submitting) return;
      lastId = document.getElementById("auth-id").value.trim();
      const errElNow = document.getElementById("auth-error");
      if (errElNow) errElNow.style.display = "none";
      const id = document.getElementById("auth-id").value.trim();
      const pw = document.getElementById("auth-pw").value;
      const pw2 = mode === "signup" ? (document.getElementById("auth-pw2")?.value ?? "") : "";
      const signupCode = mode === "signup" ? (document.getElementById("auth-signup-code")?.value ?? "").trim() : "";

      if (!ID_PATTERN.test(id) || id.length < 4 || id.length > 20) {
        showErr("아이디는 영문과 숫자만 사용해 4~20자로 입력해주세요."); return;
      }
      if (!PW_PATTERN.test(pw) || pw.length < 6 || pw.length > 20) {
        showErr("비밀번호는 영문과 숫자만 사용해 6~20자로 입력해주세요."); return;
      }
      if (mode === "signup" && pw !== pw2) {
        showErr("비밀번호가 일치하지 않습니다."); return;
      }
      if (mode === "signup" && !signupCode) {
        showErr("가입 코드를 입력해주세요."); return;
      }

      const idKey = id.toLowerCase();
      const email = adminEmail(idKey);
      const ref = doc(db, COLLECTIONS.ADMINS, idKey);
      const fail = (msg) => { authBusy = false; submitting = false; paint(); showErr(msg); };
      submitting = true; paint();
      await persistenceReady;
      authBusy = true;

      try {
        let displayId = id;
        if (mode === "signup") {
          if (await adminIdTaken(ref)) return fail("이미 사용 중인 아이디입니다.");
          let cred;
          try { cred = await createUserWithEmailAndPassword(auth, email, pw); }
          catch (e) { if (e.code === "auth/email-already-in-use") return fail("이미 사용 중인 아이디입니다."); throw e; }
          // 가입 코드 확인은 Firestore 규칙에서 함 (config/signup 문서의 code와 같아야 저장됨)
          try {
            const batch = writeBatch(db);
            batch.set(doc(db, COLLECTIONS.SIGNUP_CLAIMS, idKey), { code: signupCode, uid: cred.user.uid });
            batch.set(ref, { id, uid: cred.user.uid, createdAt: serverTimestamp() });
            batch.set(doc(db, COLLECTIONS.ADMIN_UIDS, cred.user.uid), { ownerId: idKey });
            await batch.commit();
          } catch (e) {
            // 코드가 틀리면 방금 만든 로그인 계정을 지워서 아이디가 묶이지 않게 함
            try { await cred.user.delete(); } catch (e2) {}
            if (e.code === "permission-denied") return fail("가입 코드가 올바르지 않습니다.");
            throw e;
          }
        } else {
          if (!(await adminIdTaken(ref))) return fail("존재하지 않는 아이디입니다.");
          let signedIn = false;
          try { await signInWithEmailAndPassword(auth, email, pw); signedIn = true; }
          catch (e) { if (!WRONG_PW_CODES.includes(e.code)) throw e; }
          if (!signedIn) {
            // 비밀번호가 틀렸거나, 아직 새 로그인 방식으로 옮기지 않은 예전 계정
            let cred;
            try { cred = await createUserWithEmailAndPassword(auth, email, pw); }
            catch (e) { if (e.code === "auth/email-already-in-use") return fail("비밀번호가 올바르지 않습니다."); throw e; }
            try {
              // 예전 비밀번호 해시와 같은지는 Firestore 규칙에서 확인 (해시는 누구도 읽을 수 없게 막아 둠)
              await setDoc(ref, { id, uid: cred.user.uid, migratedAt: serverTimestamp(), pwHashProof: await sha256Hex(pw) });
            } catch (e) {
              try { await cred.user.delete(); } catch (e2) {}
              if (e.code === "permission-denied") return fail("비밀번호가 올바르지 않습니다.");
              throw e;
            }
          }
          try { const me = await getDoc(ref); if (me.exists() && me.data().id) displayId = me.data().id; } catch (e) {}
        }
        sessionStorage.setItem(ADMIN_USER_KEY, displayId);
        currentOwner = idKey;
        if (auth.currentUser) ensureUidLink(auth.currentUser.uid, idKey);
        authBusy = false;
        render();
      } catch (err) {
        console.error(err);
        try { if (auth.currentUser) await signOut(auth); } catch (e) {}
        fail(authErrorMessage(err));
      }
    };
  }

  paint();
}

  function renderStats() {
    const total = questions.length;

    const imported = questions.filter((q) => q.isImported).length;

    const byClass = CLASSES.map((c) => ({ label: c, value: questions.filter((q) => q.class === c).length }));
