    if (bySubject.length === 0) bySubject = SUBJECTS.map((s) => ({ label: s, value: 0 }));
    const maxClass = Math.max(...byClass.map((d) => d.value), 1);
    const maxSubject = Math.max(...bySubject.map((d) => d.value), 1);

    document.getElementById("stats-container").innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">전체 문제 수</div><div class="stat-value">${total}</div></div>
        <div class="stat-card"><div class="stat-label">승인된 문제 수</div><div class="stat-value" style="color:var(--green);">${approved}</div></div>

      <div class="two-col" style="grid-template-columns:1fr 1fr;">
        <div class="card">
          <p style="font-weight:700;font-size:14px;margin:0 0 10px;">반별 참여(제출) 수</p>
          ${byClass.map((d) => `<div class="bar-row"><span class="bar-label">${esc(d.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.value / maxClass) * 100}%;"></div></div><span class="bar-val">${d.value}</span></div>`).join("")}
        </div>
        <div class="card">
          <p style="font-weight:700;font-size:14px;margin:0 0 10px;">과목별 문제 수</p>
          ${bySubject.map((d) => `<div class="bar-row"><span class="bar-label">${esc(d.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.value / maxSubject) * 100}%;background:var(--green);"></div></div><span class="bar-val">${d.value}</span></div>`).join("")}
        </div>

    // 통계 카드는 위쪽에, 반별·과목별 그래프는 '문제 관리' 탭의 접이식 칸으로 옮김
    const statsEl = document.getElementById("stats-container");
    const charts = statsEl.querySelector(".two-col");
    const chartsEl = document.getElementById("charts-container");
    if (charts && chartsEl) { charts.style.marginTop = "0"; chartsEl.innerHTML = ""; chartsEl.appendChild(charts); }

  }

        현재 출제 학년·학기: ${GRADE_TERM ? esc(gradeTermLabel(GRADE_TERM)) : "설정 안 됨 (학생에게 단원 선택이 안 보여요)"}

        </select>
        <select class="input" id="unit-subject-select" style="flex:1;padding:9px;font-size:13px;">
          ${SUBJECTS.map((s) => `<option value="${esc(s)}" ${unitUI.subject === s ? "selected" : ""}>${esc(s)}${unitsFor(s, unitUI.gt).length ? ` (${unitsFor(s, unitUI.gt).length})` : ""}</option>`).join("")}

      <textarea class="input" id="unit-textarea" rows="6" placeholder="한 줄에 한 단원씩 입력하세요.&#10;예)&#10;1. 재미있는 나의 탐구&#10;2. 생물과 환경" style="font-size:13px;padding:10px;resize:vertical;">${esc(list.join("\n"))}</textarea>
      <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 10px;">${filledSubjects.length ? `${esc(gradeTermLabel(unitUI.gt))} 단원이 있는 과목: ${filledSubjects.map(esc).join(", ")}` : `${esc(gradeTermLabel(unitUI.gt))}에는 아직 단원이 없어요.`}</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-gold" id="save-units-btn" style="flex:1;padding:9px;font-size:12px;">단원 저장</button>
        ${custom && hasDefault ? `<button class="btn btn-ghost" id="reset-units-btn" style="flex:1;padding:9px;font-size:12px;">기본값으로 되돌리기</button>` : ""}
      </div>
      <button class="btn ${GRADE_TERM === unitUI.gt ? "btn-ghost" : "btn-dark"}" id="set-gt-btn" style="width:100%;margin-top:8px;padding:9px;font-size:12px;" ${GRADE_TERM === unitUI.gt ? "disabled" : ""}>${GRADE_TERM === unitUI.gt ? `${esc(gradeTermLabel(unitUI.gt))}로 출제 중` : `${esc(gradeTermLabel(unitUI.gt))}로 출제하기`}</button>`;

    document.getElementById("unit-gt-select").onchange = (e) => { unitUI.gt = e.target.value; unitUI.dirty = false; renderUnitManager(); };
    document.getElementById("unit-subject-select").onchange = (e) => { unitUI.subject = e.target.value; unitUI.dirty = false; renderUnitManager(); };
    document.getElementById("unit-textarea").oninput = () => { unitUI.dirty = true; };
    document.getElementById("save-units-btn").onclick = async () => {
      const lines = document.getElementById("unit-textarea").value.split("\n").map((l) => l.trim()).filter(Boolean);
      const unique = [...new Set(lines)].map((l) => l.slice(0, 40));
      if (unique.length > 20) { showNotice("한 과목에 단원은 20개까지 넣을 수 있어요."); return; }
      const nextUnits = JSON.parse(JSON.stringify(UNITS || {}));
      if (!nextUnits[unitUI.gt]) nextUnits[unitUI.gt] = {};
      // 빈 목록도 그대로 저장 (= 이 과목은 단원 선택 안 함). 기본 목록으로 돌아가려면 '기본값으로 되돌리기'

      try {

  function renderJoinCodeCard() {
    const container = document.getElementById("join-code-container");
    if (!container) return;
    container.innerHTML = `
      <p style="font-weight:700;font-size:14px;margin:0 0 10px;">학생 참여 코드</p>

          <button class="btn btn-ghost" id="copy-code-btn" style="flex:1;font-size:12px;padding:9px;">코드 복사</button>

        </div>` : `
        <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px;">참여 코드를 생성하는 중입니다...</p>
        <button class="btn btn-gold" id="regen-code-btn" style="width:100%;font-size:12px;padding:9px;">코드 발급하기</button>`}`;

    const copyBtn = document.getElementById("copy-code-btn");
    if (copyBtn) copyBtn.onclick = async () => {
      try { await navigator.clipboard.writeText(joinCode); showNotice("참여 코드를 복사했습니다."); } catch (e) {}
    };
    const regenBtn = document.getElementById("regen-code-btn");
    if (regenBtn) regenBtn.onclick = async () => {
      if (joinCode && !window.confirm("새 코드를 발급하면 기존 코드는 더 이상 사용할 수 없습니다. 계속할까요?")) return;
      regenBtn.disabled = true;
      await ensureJoinCode({ force: true });
    };
  }

  async function ensureJoinCode({ force = false } = {}) {
    if (ensuringJoinCode) return;
    if (joinCode && !force) return;
    ensuringJoinCode = true;
    const oldCode = joinCode;
    try {
      let newCode = "";
      let attempts = 0;
      do {
        newCode = generateJoinCode();
        attempts++;
        const exists = await getDoc(doc(db, COLLECTIONS.JOIN_CODES, newCode));
        if (!exists.exists()) break;
      } while (attempts < 8);

      await setDoc(doc(db, COLLECTIONS.JOIN_CODES, newCode), { ownerId, createdAt: serverTimestamp() });
      await setDoc(doc(db, COLLECTIONS.SETTINGS, ownerId), { joinCode: newCode }, { merge: true });
      if (oldCode && oldCode !== newCode) {
        try { await deleteDoc(doc(db, COLLECTIONS.JOIN_CODES, oldCode)); } catch (e) {}
      }
      joinCode = newCode;
      showNotice("참여 코드를 발급했습니다.");
      renderJoinCodeCard();
    } catch (err) {
      console.error(err);
      showNotice("참여 코드 발급 중 오류가 발생했습니다.");
    } finally {
      ensuringJoinCode = false;
    }
  }

      <div style="display:flex;align-items:center;justify-content:space-between;">

        <button class="btn ${practiceOpen ? "btn-ghost" : "btn-green"}" id="toggle-practice-btn" style="padding:9px 16px;font-size:12px;" ${toggling ? "disabled" : ""}>${practiceOpen ? "끄기" : "켜기"}</button>

    document.getElementById("toggle-practice-btn").onclick = async () => {

  /* ---- 연습 문제 공개 (practiceSets/{ownerId}) ---- */
  let practiceScope = "both";
  let practiceClasses = [];      // 연습 문제로 공개할 반 (빈 목록 = 모든 반)
  let publishedHash = null;      // 지금 공개된 연습 문제 묶음의 해시
  let syncTimer = null;
  function practiceItemsFor(scope) { return questions.filter((q) => isPracticeQuestion(q, scope, practiceClasses)).map(toPracticeItem); }
  async function publishPracticeSet(open) {
    const items = open ? practiceItemsFor(practiceScope) : [];
    const json = JSON.stringify(items);
    if (json.length > 900000) throw new Error("too-large"); // Firestore 문서 하나는 1MB까지
    const hash = hashString(json);
    await setDoc(doc(db, COLLECTIONS.PRACTICE_SETS, ownerId), { items, hash, updatedAt: serverTimestamp() });
    publishedHash = hash;
  }
  // 연습 모드가 켜져 있으면 문제 목록이 바뀔 때 공개 묶음도 맞춰 줌 (잠깐 모았다가 한 번에)
  async function flushPracticeSync() {
    syncTimer = null;
    if (!practiceOpen) return;
    const hash = hashString(JSON.stringify(practiceItemsFor(practiceScope)));
    if (hash === publishedHash) return;
    try { await publishPracticeSet(true); } catch (err) { console.error("연습 문제 반영 실패:", err); if (err.message === "too-large") showNotice("연습 문제가 너무 많아 반영하지 못했어요. 범위를 줄여주세요."); }
  }
  function schedulePracticeSync() {
    if (!practiceOpen || loading) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flushPracticeSync, 1500);
  }
  // 관리자 화면을 떠날 때 기다리던 반영이 있으면 바로 보냄
  registerCleanup(() => { if (syncTimer) { clearTimeout(syncTimer); flushPracticeSync(); } });


  /* ---- 랜덤 추첨 패널 ---- */
  // 승인된 문제에 실제로 들어 있는 '과목·단원' 조합 (추첨 범위용)
  function unitScopeOptions() {
    const m = new Map();
    questions.filter((q) => q.isApproved && q.unit).forEach((q) => {
      const key = `${q.subject}||${q.unit}`;
      const cur = m.get(key) || { value: key, label: `${q.subject} ${q.unit}`, count: 0 };
      cur.count += 1; m.set(key, cur);
    });
    return [...m.values()].sort((a, b) => a.label.localeCompare(b.label, "ko", { numeric: true }));

  /* ---- 필터 + 테이블 ---- */
  function getFilteredQuestions() {
    return questions.filter((q) => {
      if (filters.studentClass && q.class !== filters.studentClass) return false;
      if (filters.subject && q.subject !== filters.subject) return false;
      if (filters.type && q.type !== filters.type) return false;
      if (filters.approval === "approved" && !q.isApproved) return false;
      if (filters.approval === "pending" && (q.isApproved || q.isImported)) return false;
      if (filters.approval === "imported" && !q.isImported) return false;
      if (filters.search) {
        const s = filters.search.toLowerCase();
        if (![q.name, q.question, q.unit].some((v) => (v || "").toLowerCase().includes(s))) return false;
      }
      return true;
    });
  }

  // 승인 / 승인 취소 / 삭제 (표와 상세 창에서 같이 씀)
  async function questionAction(id, action) {
    if (action === "delete" && !window.confirm("이 문제를 삭제하시겠습니까? 삭제 후에는 되돌릴 수 없습니다.")) return false;
    busyId = id; renderTable();
    const msg = { approve: ["문제를 승인했습니다.", "승인 중 오류가 발생했습니다."], unapprove: ["승인을 취소했습니다.", "승인 취소 중 오류가 발생했습니다."], delete: ["문제를 삭제했습니다.", "삭제 중 오류가 발생했습니다."] }[action];
    try {
      if (action === "approve") await updateDoc(doc(db, COLLECTIONS.QUESTIONS, id), { isApproved: true });
      else if (action === "unapprove") await updateDoc(doc(db, COLLECTIONS.QUESTIONS, id), { isApproved: false });
      else await deleteDoc(doc(db, COLLECTIONS.QUESTIONS, id));
      showNotice(msg[0]);
      return true;
    } catch (err) { console.error(err); showNotice(msg[1]); return false; }
    finally { busyId = null; renderTable(); }
  }

          ${isMultiple ? "" : `<div><label class="label" style="font-size:12px;">정답으로 인정할 답 (한 줄에 하나)</label>
            <textarea class="input" id="m-accepted" rows="3" style="resize:vertical;">${esc(ed.accepted)}</textarea></div>`}
          ${errMsg ? `<p class="error-box">${esc(errMsg)}</p>` : ""}
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
            <button class="btn btn-gold" id="m-save" style="flex:2;min-width:140px;">수정 내용 저장</button>
            ${q.isApproved
              ? `<button class="btn btn-ghost" id="m-unapprove" style="flex:1;">승인 취소</button>`
              : `<button class="btn btn-green" id="m-approve" style="flex:1;">${q.isImported ? "골든벨 포함" : "승인"}</button>`}

          </div>

      const keep = () => {
        ed.subject = body.querySelector("#m-subject").value;
        ed.unit = body.querySelector("#m-unit").value;
        ed.page = body.querySelector("#m-page").value;
        ed.question = body.querySelector("#m-question").value;
        ed.answer = body.querySelector("#m-answer").value;
        const accEl = body.querySelector("#m-accepted"); if (accEl) ed.accepted = accEl.value;
        body.querySelectorAll(".m-choice").forEach((inp) => { ed.choices[Number(inp.dataset.i)] = inp.value; });
      };
      body.querySelector("#m-subject").onchange = () => { keep(); if (!unitsFor(ed.subject, gt).includes(ed.unit)) ed.unit = ""; paintModal(); };
      body.querySelectorAll(".m-type").forEach((b) => b.onclick = () => { keep(); ed.type = b.dataset.type; paintModal(); });
      body.querySelectorAll(".m-correct").forEach((b) => b.onclick = () => { keep(); ed.correctChoice = b.dataset.n; paintModal(); });
      body.querySelector("#m-save").onclick = async () => {
        keep();
        const page = normalizePage(ed.page);
        if (page && !PAGE_PATTERN.test(page)) return paintModal("쪽수는 숫자로 적어주세요. 예: 45 또는 45~46");
        const v = validateQuestion(ed);
        if (!v.valid) return paintModal(v.message);
        const isMul = ed.type === QUESTION_TYPES.MULTIPLE;
        const choices = isMul ? ed.choices.map((c) => c.trim()) : [];
        const update = {
          subject: ed.subject, unit: ed.unit, page, type: ed.type, question: ed.question.trim(),
          answer: ed.answer.trim() || (isMul ? choices[Number(ed.correctChoice) - 1] : ""),
          acceptedAnswers: isMul ? [] : parseAccepted(ed.accepted).filter((x) => normAnswer(x) !== normAnswer(ed.answer)),
          choices, correctChoice: isMul ? ed.correctChoice : "", editedAt: serverTimestamp(),
        };
        try { await updateDoc(doc(db, COLLECTIONS.QUESTIONS, id), update); closeModal(); showNotice("문제를 수정했습니다."); }
        catch (err) { console.error(err); paintModal("저장 중 오류가 발생했습니다."); }
      };
      const ap = body.querySelector("#m-approve"); if (ap) ap.onclick = async () => { if (await questionAction(id, "approve")) closeModal(); };
      const un = body.querySelector("#m-unapprove"); if (un) un.onclick = async () => { if (await questionAction(id, "unapprove")) closeModal(); };

  document.getElementById("filter-search").oninput = (e) => { filters.search = e.target.value; renderTable(); };

      const snap = await getDocs(q);

      // Firestore 일괄 처리는 한 번에 500개까지만 가능하므로 나눠서 삭제
      for (let i = 0; i < snap.docs.length; i += 450) {

  document.getElementById("import-csv-input").onchange = async (e) => {

    e.target.value = "";

    let text = "";
    try {
      const buf = await file.arrayBuffer();
      text = new TextDecoder("utf-8").decode(buf);
      // 엑셀에서 다시 저장해 EUC-KR(CP949)이 된 파일 대비
      if (text.includes("\uFFFD")) { try { text = new TextDecoder("euc-kr").decode(buf); } catch (err) {} }
    } catch (err) { showNotice("파일을 읽지 못했습니다."); return; }
    const { items, skipped, error } = csvRowsToQuestions(parseCSV(text));
    if (error) { showNotice(error); return; }
    // 이미 있는 문제(같은 과목+같은 문제)는 건너뜀
    const existing = new Set(questions.map((q) => `${q.subject}||${(q.question || "").trim()}`));
    const fresh = items.filter((q) => !existing.has(`${q.subject}||${q.question}`));
    const dup = items.length - fresh.length;
    if (fresh.length === 0) { showNotice(`새로 가져올 문제가 없습니다. (중복 ${dup}개${skipped ? `, 형식 오류 ${skipped}개` : ""})`); return; }
    if (fresh.length > 1000) { showNotice("한 번에 1000문제까지 가져올 수 있어요."); return; }
    if (!window.confirm(`${file.name}\n\n${fresh.length}문제를 연습 문제로 가져올까요?${dup ? `\n(이미 있는 문제 ${dup}개는 건너뜀)` : ""}${skipped ? `\n(형식이 맞지 않는 줄 ${skipped}개는 건너뜀)` : ""}`)) return;
    try {
      for (let i = 0; i < fresh.length; i += 450) {
        const batch = writeBatch(db);
        fresh.slice(i, i + 450).forEach((q) => {
          batch.set(doc(collection(db, COLLECTIONS.QUESTIONS)), {
            ...q, ownerId, createdAt: serverTimestamp(),
            isApproved: false, isImported: true, importedFrom: file.name.slice(0, 80), isDeleted: false,
          });
        });
        await batch.commit();
      }
      showNotice(`연습 문제 ${fresh.length}개를 가져왔습니다.${practiceOpen ? "" : " (학생 연습 모드를 켜야 학생이 풀 수 있어요)"}`);
    } catch (err) { console.error(err); showNotice("가져오는 중 오류가 발생했습니다."); }
  };
  document.getElementById("delete-imported-btn").onclick = async () => {
    const targets = questions.filter((q) => q.isImported);
    if (targets.length === 0) { showNotice("가져온 연습 문제가 없습니다."); return; }
    if (!window.confirm(`가져온 연습 문제 ${targets.length}개를 모두 삭제하시겠습니까? 되돌릴 수 없습니다.`)) return;
    try {
      for (let i = 0; i < targets.length; i += 450) {
        const batch = writeBatch(db);
        targets.slice(i, i + 450).forEach((q) => batch.delete(doc(db, COLLECTIONS.QUESTIONS, q.id)));
        await batch.commit();
      }
      showNotice(`가져온 연습 문제 ${targets.length}개를 삭제했습니다.`);
    } catch (err) { console.error(err); showNotice("삭제 중 오류가 발생했습니다."); }
  };

  renderDrawPanel();
  renderToggle();
  renderStats();
  renderTable();
  renderSubjectManager();
  renderClassManager();
  renderUnitManager();
  renderJoinCodeCard();

  const unsubQuestions = onSnapshot(
    query(collection(db, COLLECTIONS.QUESTIONS), where("ownerId", "==", ownerId)),
    (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      questions = list.filter((item) => !item.isDeleted)
        .sort((a, b) => (b.createdAt?.toMillis?.() ?? 0) - (a.createdAt?.toMillis?.() ?? 0));
      loading = false; loadErr = null;
      document.getElementById("live-dot").style.display = "inline-flex";
      renderStats(); renderTable(); refreshUnitScopeOptions(); renderToggle(); schedulePracticeSync();
    },
    (err) => { console.error("문제 목록 구독 오류:", err); loadErr = "문제 목록을 불러오는 중 오류가 발생했습니다."; loading = false; renderTable(); }
  );
  registerCleanup(unsubQuestions);

  const unsubSettings = onSnapshot(
    doc(db, COLLECTIONS.SETTINGS, ownerId),
    (snap) => {
      submissionOpen = snap.exists() ? snap.data().isSubmissionOpen !== false : true;
      const remoteSubjects = snap.exists() ? snap.data().subjects : null;
      if (Array.isArray(remoteSubjects) && remoteSubjects.length > 0) SUBJECTS = remoteSubjects;
      const remoteClasses = snap.exists() ? snap.data().classes : null;
      if (Array.isArray(remoteClasses) && remoteClasses.length > 0) CLASSES = remoteClasses;
      joinCode = snap.exists() ? (snap.data().joinCode || null) : null;
      practiceOpen = snap.exists() ? snap.data().isPracticeOpen === true : false;
      maxPerStudent = snap.exists() ? Math.max(0, Number(snap.data().maxPerStudent) || 0) : 0;
      const nextScope = snap.exists() && PRACTICE_SCOPES[snap.data().practiceScope] ? snap.data().practiceScope : "both";
      if (nextScope !== practiceScope) { practiceScope = nextScope; publishedHash = null; }
      const rc = snap.exists() && Array.isArray(snap.data().practiceClasses) ? snap.data().practiceClasses : [];
      if (JSON.stringify(rc) !== JSON.stringify(practiceClasses)) { practiceClasses = rc; publishedHash = null; }
      applyUnitSettings(snap.exists() ? snap.data() : null);
      schedulePracticeSync();
      renderUnitManager();
      renderToggle();
      refreshSubjectDependentUI();
      refreshClassDependentUI();
      renderJoinCodeCard();
      if (!joinCode) ensureJoinCode();
    },
    () => { submissionOpen = true; renderToggle(); }
  );
  registerCleanup(unsubSettings);
}

/* =========================================================================
   골든벨 진행 화면
   ========================================================================= */
function playBeep() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  } catch (err) { console.warn("효과음 재생 실패:", err); }
}
function timerHTML(totalSeconds, remainingSeconds) {
  if (totalSeconds === null || totalSeconds === undefined) return `<div class="timer-none">제한 없음</div>`;
  const radius = 34, circumference = 2 * Math.PI * radius;
  const ratio = Math.max(0, Math.min(1, remainingSeconds / totalSeconds));
  const offset = circumference * (1 - ratio);
  const isUrgent = remainingSeconds <= 5 && remainingSeconds > 0;
  const isDone = remainingSeconds <= 0;
  const stroke = isDone ? "#DD4B3E" : isUrgent ? "#F0A93D" : "#E8B923";
  return `<div class="timer-wrap">
    <svg viewBox="0 0 80 80" class="timer-svg">
      <circle cx="40" cy="40" r="${radius}" fill="none" style="stroke:var(--gb-surface2)" stroke-width="6"/>
      <circle cx="40" cy="40" r="${radius}" fill="none" stroke="${stroke}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 1s linear, stroke .3s;"/>
    </svg>
    <div class="timer-value ${isUrgent ? "urgent" : ""}">${Math.max(0, remainingSeconds)}</div>
  </div>`;
}
function authorText(question, revealMode, answerRevealed) {
  switch (revealMode) {
    case REVEAL_MODES.FULL_NAME: return `${question.name} (${question.class} ${question.number}번)`;
    case REVEAL_MODES.NAME_ONLY: return question.name;
    case REVEAL_MODES.ANONYMOUS: return `${question.class} ${question.number}번 학생`;
    case REVEAL_MODES.AFTER_ANSWER: return answerRevealed ? `${question.name} (${question.class} ${question.number}번)` : null;
    default: return `${question.class} ${question.number}번 학생`;
  }
}

// 골든벨 화면 밝기 (어두운 화면 / 밝은 화면) — 이 기기에 기억
const GB_THEME_KEY = "goldenbell_gb_theme";
function gbTheme() { try { return localStorage.getItem(GB_THEME_KEY) === "light" ? "light" : "dark"; } catch (e) { return "dark"; } }
function applyGbTheme(theme) {
  document.body.classList.toggle("gb-light", theme === "light");
  try { localStorage.setItem(GB_THEME_KEY, theme); } catch (e) {}
}

function renderGoldenBellPage() {
  applyGbTheme(gbTheme());
  let quizData = loadSession(ACTIVE_QUIZ_KEY, null);
  let index = 0, revealed = false, finished = false, showSettings = false, timeLeft = null, isFullscreen = !!document.fullscreenElement;
  let timerInterval = null, hasBeeped = false, advanceTimeout = null;

  registerCleanup(() => { if (timerInterval) clearInterval(timerInterval); if (advanceTimeout) clearTimeout(advanceTimeout); });

  const questions = quizData?.questions || [];
  if (!quizData || questions.length === 0) {
    app.innerHTML = `
      <div class="gb-empty">
        <div>
          <p style="font-size:17px;font-weight:700;margin-bottom:16px;">추첨된 문제 세트가 없습니다.</p>
          <a href="#/admin" class="btn btn-gold" style="display:inline-block;">관리자 화면에서 먼저 추첨해주세요</a>
        </div>
      </div>`;
    return;
  }
  // 새로고침해도 진행 중이던 문제 번호에서 이어서 시작
  if (Number.isInteger(quizData.currentIndex) && quizData.currentIndex >= 0 && quizData.currentIndex < questions.length) index = quizData.currentIndex;
  function saveProgress() { quizData = { ...quizData, currentIndex: index }; saveSession(ACTIVE_QUIZ_KEY, quizData); }

  function getSettings() { return quizData.settings || { revealMode: "익명", timerSeconds: null, autoAdvanceOnTimeout: false }; }

  function updateSettings(newSettings) {
    const prev = getSettings();
    quizData = { ...quizData, settings: newSettings };
    saveSession(ACTIVE_QUIZ_KEY, quizData);
    // 타이머 관련 설정이 바뀐 경우에만 타이머를 다시 시작 (공개 방식만 바꿀 땐 정답 공개 상태·남은 시간 유지)
    if (prev.timerSeconds !== newSettings.timerSeconds || prev.autoAdvanceOnTimeout !== newSettings.autoAdvanceOnTimeout) startTimer();
    paintTopbar();
    paintQuestionArea();
  }

  function resetTimerForCurrentQuestion() {
    revealed = false;
    startTimer();
  }

  function startTimer() {
    hasBeeped = false;
    const settings = getSettings();
    timeLeft = settings.timerSeconds;
    if (timerInterval) clearInterval(timerInterval);
    if (advanceTimeout) { clearTimeout(advanceTimeout); advanceTimeout = null; }
    if (settings.timerSeconds !== null && settings.timerSeconds !== undefined && !finished) {
      timerInterval = setInterval(() => {
        if (timeLeft === null) return;
        if (timeLeft <= 1) {
          timeLeft = 0;
          if (!hasBeeped) {
            hasBeeped = true;
            playBeep();
            if (settings.autoAdvanceOnTimeout) advanceTimeout = setTimeout(() => { advanceTimeout = null; goNext(); }, 800);
          }
        } else timeLeft -= 1;
        paintTimer();
      }, 1000);
    }
  }

  function goNext() {
    if (finished) return;
    if (index >= questions.length - 1) { finished = true; paintAll(); return; }
    index += 1; saveProgress(); resetTimerForCurrentQuestion(); paintAll();
  }
  function goPrev() {
    if (finished || index === 0) return;
    index -= 1; saveProgress(); resetTimerForCurrentQuestion(); paintAll();
  }

  // 발표용 키보드 단축키: → 다음, ← 이전, 스페이스/엔터 정답 보기
  const keyHandler = (e) => {
    if (finished || e.target.closest?.("select, input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
    else if ((e.key === " " || e.key === "Enter") && !revealed) { e.preventDefault(); revealed = true; paintQuestionArea(); }
  };
  document.addEventListener("keydown", keyHandler);
  registerCleanup(() => document.removeEventListener("keydown", keyHandler));

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  const fsHandler = () => { isFullscreen = !!document.fullscreenElement; paintTopbar(); };
  document.addEventListener("fullscreenchange", fsHandler);
  registerCleanup(() => document.removeEventListener("fullscreenchange", fsHandler));

  function paintAll() {
    if (finished) { paintSummary(); return; }
    const settings = getSettings();
    const q = questions[index];
    const isMultiple = q.type === QUESTION_TYPES.MULTIPLE;
    const isLast = index === questions.length - 1;
    app.innerHTML = `
      <div style="min-height:calc(100vh - var(--footer-h));display:flex;flex-direction:column;">
        <div class="gb-topbar" id="gb-topbar"></div>
        <div class="gb-body" id="gb-question-area"></div>
        <div class="gb-bottombar">
          <div class="gb-bottom-side" id="gb-survivors-slot"></div>
          <div class="gb-bottom-center">
            <button class="gb-nav-btn" id="prev-q-btn" ${index === 0 ? "disabled" : ""}>이전</button>
            <button class="gb-nav-btn" id="skip-q-btn">건너뛰기</button>
            ${isLast
              ? `<button class="gb-nav-btn gb-nav-main" id="finish-btn" style="background:var(--red);">골든벨 종료</button>`
              : `<button class="gb-nav-btn gb-nav-main" id="next-q-btn" style="background:var(--gold);color:#2A2208;">다음 문제</button>`}
          </div>
          <div class="gb-bottom-side gb-keys">방향키로 문제 이동, 스페이스로 정답 보기</div>
        </div>
      </div>`;
    paintTopbar();
    paintQuestionArea();
    document.getElementById("prev-q-btn").onclick = goPrev;
    document.getElementById("skip-q-btn").onclick = goNext;
    const nextBtn = document.getElementById("next-q-btn");
    if (nextBtn) nextBtn.onclick = goNext;
    const finishBtn = document.getElementById("finish-btn");
    if (finishBtn) finishBtn.onclick = () => { finished = true; paintAll(); };
    // 클릭한 버튼에 포커스가 남아 스페이스/엔터가 버튼을 다시 누르지 않도록
    app.querySelectorAll(".gb-nav-btn").forEach((b) => b.addEventListener("mouseup", () => b.blur()));
  }

  // ---- 남은 학생 수 (탈락자 세기) ----
  function survivorsHTML() {
    if (!quizData.participants) return "";
    const n = quizData.survivors ?? quizData.participants;
    return `<div class="gb-survivors" title="남은 학생 수">
      <button class="gb-icon-btn" id="surv-minus" title="탈락 1명" style="font-size:.9em;">−</button>
      <div style="text-align:center;min-width:3.6em;line-height:1.1;">
        <div style="font-size:.6em;color:var(--gb-muted);">남은 학생</div>
        <div style="font-size:1.35em;font-weight:800;color:${n <= 3 ? "var(--gold)" : "var(--gb-fg)"};">${n}<span style="font-size:.5em;color:var(--gb-muted);font-weight:600;"> / ${quizData.participants}</span></div>
      </div>
      <button class="gb-icon-btn" id="surv-plus" title="1명 되살리기" style="font-size:.9em;">+</button>
      <button class="gb-text-btn" id="surv-revive">패자부활</button>
    </div>`;
  }
  function setSurvivors(n) {
    quizData = { ...quizData, survivors: Math.max(0, Math.min(quizData.participants, n)) };
    saveSession(ACTIVE_QUIZ_KEY, quizData);
    paintTopbar();
  }
  function bindSurvivors() {
    const m = document.getElementById("surv-minus"); if (!m) return;
    m.onclick = () => setSurvivors((quizData.survivors ?? quizData.participants) - 1);
    document.getElementById("surv-plus").onclick = () => setSurvivors((quizData.survivors ?? quizData.participants) + 1);
    document.getElementById("surv-revive").onclick = () => { if (window.confirm("패자부활! 모든 학생을 다시 살릴까요?")) setSurvivors(quizData.participants); };
  }

  function paintTopbar() {
    const settings = getSettings();
    const q = questions[index];
    const percent = questions.length > 0 ? ((index + 1) / questions.length) * 100 : 0;
    document.getElementById("gb-topbar").innerHTML = `
      <div class="gb-progress">
        <span class="gb-count">${index + 1}<small> / ${questions.length}</small></span>
        <div class="gb-progress-track"><div class="gb-progress-fill" style="width:${percent}%;"></div></div>
      </div>
      <div class="gb-subject-chip">${esc(subjectWithUnit(q))}</div>
      <div class="gb-top-right">
        <span id="gb-timer">${timerHTML(settings.timerSeconds, timeLeft ?? 0)}</span>
        <button class="gb-text-btn" id="theme-toggle-btn">${gbTheme() === "light" ? "칠판 화면" : "화이트보드 화면"}</button>
        <button class="gb-text-btn" id="settings-toggle-btn">설정</button>
        <button class="gb-text-btn" id="fullscreen-btn">${isFullscreen ? "전체화면 끄기" : "전체화면"}</button>
      </div>
      ${showSettings ? settingsPanelHTML(settings) : ""}`;
    const slot = document.getElementById("gb-survivors-slot");
    if (slot) slot.innerHTML = survivorsHTML();
    document.getElementById("settings-toggle-btn").onclick = () => { showSettings = !showSettings; paintTopbar(); };
    document.getElementById("theme-toggle-btn").onclick = (e) => {
      applyGbTheme(gbTheme() === "light" ? "dark" : "light");
      e.currentTarget.blur();
      paintTopbar();
    };
    document.getElementById("fullscreen-btn").onclick = toggleFullscreen;
    bindSurvivors();
    if (showSettings) bindSettingsPanel(settings);
  }

  function paintTimer() {
    const settings = getSettings();
    const el = document.getElementById("gb-timer");
    if (el) el.innerHTML = timerHTML(settings.timerSeconds, timeLeft ?? 0);
  }

  function settingsPanelHTML(settings) {
    return `
      <div class="gb-settings-panel fade-in">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <p style="font-weight:800;font-size:14px;margin:0;">골든벨 설정</p>
          <button id="close-settings-btn" style="background:none;color:var(--gb-muted);font-size:13px;">닫기</button>
        </div>
        <div style="margin-bottom:12px;">
          <p style="font-size:12px;color:var(--gb-muted);margin:0 0 6px;">출제자 공개 방식</p>
          <select id="reveal-mode-select" style="width:100%;padding:9px;border-radius:10px;background:var(--gb-input);color:var(--gb-fg);border:1px solid var(--gb-line);">
            ${Object.values(REVEAL_MODES).map((m) => `<option value="${m}" ${settings.revealMode === m ? "selected" : ""}>${m}</option>`).join("")}
          </select>
        </div>
        <div style="margin-bottom:12px;">
          <p style="font-size:12px;color:var(--gb-muted);margin:0 0 6px;">타이머</p>
          <select id="timer-select" style="width:100%;padding:9px;border-radius:10px;background:var(--gb-input);color:var(--gb-fg);border:1px solid var(--gb-line);">
            ${TIMER_OPTIONS.map((opt) => `<option value="${opt.value === null ? "null" : opt.value}" ${settings.timerSeconds === opt.value ? "selected" : ""}>${opt.label}</option>`).join("")}
          </select>
        </div>
        <div style="margin-bottom:12px;">
          <p style="font-size:12px;color:var(--gb-muted);margin:0 0 6px;">화면</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            <button type="button" class="gb-theme-opt" data-theme="dark" style="padding:9px;border-radius:8px;font-weight:700;font-size:13px;background:${gbTheme() === "dark" ? "var(--gold)" : "var(--gb-input)"};color:${gbTheme() === "dark" ? "#2A2208" : "var(--gb-fg)"};">칠판</button>
            <button type="button" class="gb-theme-opt" data-theme="light" style="padding:9px;border-radius:8px;font-weight:700;font-size:13px;background:${gbTheme() === "light" ? "var(--gold)" : "var(--gb-input)"};color:${gbTheme() === "light" ? "#2A2208" : "var(--gb-fg)"};">화이트보드</button>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gb-strong);">
          <input type="checkbox" id="auto-advance-check" ${settings.autoAdvanceOnTimeout ? "checked" : ""} style="accent-color:var(--gold);width:16px;height:16px;">
          시간 종료 시 자동으로 다음 문제로 이동
        </label>
      </div>`;
  }
  function bindSettingsPanel(settings) {
    document.getElementById("close-settings-btn").onclick = () => { showSettings = false; paintTopbar(); };
    document.querySelectorAll(".gb-theme-opt").forEach((b) => b.onclick = () => { applyGbTheme(b.dataset.theme); paintTopbar(); });
    document.getElementById("reveal-mode-select").onchange = (e) => updateSettings({ ...settings, revealMode: e.target.value });
    document.getElementById("timer-select").onchange = (e) => {
      const v = e.target.value;
      updateSettings({ ...settings, timerSeconds: v === "null" ? null : Number(v) });
    };
    document.getElementById("auto-advance-check").onchange = (e) => updateSettings({ ...settings, autoAdvanceOnTimeout: e.target.checked });
  }

  function paintQuestionArea() {
    const settings = getSettings();
    const q = questions[index];
    const isMultiple = q.type === QUESTION_TYPES.MULTIPLE;
    const authorLine = authorText(q, settings.revealMode, revealed);
    document.getElementById("gb-question-area").innerHTML = `
      <div class="fade-in" style="width:100%;display:flex;flex-direction:column;align-items:center;">
        <p class="gb-qnum">문제 ${index + 1}</p>
        <p class="gb-question">${esc(q.question)}</p>
        ${isMultiple ? `
        <div class="gb-choices">
          ${(q.choices || []).map((c, i) => `
            <div class="gb-choice ${revealed && String(i + 1) === q.correctChoice ? "correct pop" : ""}">
              <span class="gb-choice-idx">${i + 1}</span>${esc(c)}
            </div>`).join("")}
        </div>` : ""}
        ${!revealed
          ? `<button class="gb-reveal-btn" id="reveal-btn">정답 보기</button>`
          : `<div class="gb-answer-card reveal">
               <p class="gb-answer-label">정답</p>
               ${isMultiple
                 ? `<p class="gb-answer-text">${esc(q.correctChoice)}번 &nbsp; <span style="font-size:.7em;font-weight:700;margin-left:.3em;">${esc((q.choices || [])[Number(q.correctChoice) - 1] || "")}</span></p>`
                 : `<p class="gb-answer-text">${esc(q.answer)}</p>
                    ${acceptedList(q).length ? `<p class="gb-accepted"><b>이것도 정답</b> ${acceptedList(q).map(esc).join(", ")}</p>` : ""}`}
               ${q.page ? `<p style="margin:.4em 0 0;font-size:.8em;font-weight:700;opacity:.8;">${esc(pageText(q))}</p>` : ""}
             </div>`}
        <div class="gb-author">${authorLine ? `출제자: <b>${esc(authorLine)}</b>` : "출제자는 정답 공개 후 표시됩니다"}</div>
      </div>`;
    const revealBtn = document.getElementById("reveal-btn");
    if (revealBtn) revealBtn.onclick = () => { revealed = true; paintQuestionArea(); };
  }

  function paintSummary() {
    if (timerInterval) clearInterval(timerInterval);
    if (advanceTimeout) { clearTimeout(advanceTimeout); advanceTimeout = null; }
    const qs = quizData.questions;
    const subjectsUsed = [...new Set(qs.map((q) => q.subject))];
    const studentMap = new Map();
    qs.forEach((q) => { const key = `${q.class}-${q.number}-${q.name}`; if (!studentMap.has(key)) studentMap.set(key, q); });
    const students = [...studentMap.values()];
    // 새로고침 후에는 전역 반/과목 목록이 기본값으로 돌아가므로, 실제 문제 데이터에서 직접 집계
    const countBy = (field) => {
      const m = new Map();
      qs.forEach((q) => m.set(q[field], (m.get(q[field]) || 0) + 1));
      return [...m.entries()].map(([label, value]) => ({ label, value }));
    };
    const byClass = countBy("class").sort((a, b) => String(a.label).localeCompare(String(b.label), "ko", { numeric: true }));
    const bySubject = countBy("subject");
    // '익명' 모드로 진행했다면 종료 화면에서도 이름을 띄우지 않음
    const anonymous = getSettings().revealMode === REVEAL_MODES.ANONYMOUS;
    const studentLabel = (s) => anonymous ? `${s.class} ${s.number}번` : `${s.name}(${s.class} ${s.number}번)`;

    app.innerHTML = `
      <div class="gb-summary">
        <div class="fade-in" style="max-width:min(1100px, 92vw);width:100%;">
          <div class="gate-bell gb-summary-bell">${BELL_SVG}</div>
          <h1 style="font-family:var(--font-display);font-size:2em;margin-bottom:1em;">골든벨이 종료되었습니다!</h1>
          <div class="gb-summary-grid">
            <div class="gb-summary-box"><p style="color:var(--gb-muted);font-size:.8em;margin:0;">총 문제 수</p><p style="font-size:1.6em;font-weight:800;margin:4px 0 0;">${qs.length}</p></div>
            <div class="gb-summary-box"><p style="color:var(--gb-muted);font-size:.8em;margin:0;">출제 학생 수</p><p style="font-size:1.6em;font-weight:800;margin:4px 0 0;">${students.length}</p></div>
            ${quizData.participants ? `<div class="gb-summary-box" style="grid-column:1 / -1;text-align:center;border:2px solid var(--gold);background:transparent;"><p style="color:var(--gb-muted);font-size:.8em;margin:0;">끝까지 남은 학생</p><p style="font-size:2.2em;font-weight:800;margin:4px 0 0;color:var(--gold);">${quizData.survivors ?? quizData.participants}명 <span style="font-size:.9em;color:var(--gb-muted);">/ ${quizData.participants}명</span></p></div>` : ""}
          </div>
          <div class="gb-summary-detail">
            <div class="gb-summary-box"><p style="font-weight:700;font-size:.8em;margin:0 0 .4em;color:var(--gb-strong);">사용한 과목</p><p style="font-size:.8em;color:var(--gb-muted);margin:0;">${esc(subjectsUsed.join(", "))}</p></div>
            <div class="gb-summary-box"><p style="font-weight:700;font-size:.8em;margin:0 0 .4em;color:var(--gb-strong);">출제 학생 목록</p><p style="font-size:.8em;color:var(--gb-muted);margin:0;max-height:96px;overflow-y:auto;">${esc(students.map(studentLabel).join(", "))}</p></div>
            <div class="gb-summary-box"><p style="font-weight:700;font-size:.8em;margin:0 0 .4em;color:var(--gb-strong);">반별 출제 수</p>${byClass.map((d) => `<p style="font-size:.8em;color:var(--gb-muted);margin:0;">${esc(d.label)}: ${d.value}문제</p>`).join("")}</div>
            <div class="gb-summary-box"><p style="font-weight:700;font-size:.8em;margin:0 0 .4em;color:var(--gb-strong);">과목별 출제 수</p>${bySubject.map((d) => `<p style="font-size:.8em;color:var(--gb-muted);margin:0;">${esc(d.label)}: ${d.value}문제</p>`).join("")}</div>
          </div>
          <button class="btn btn-gold" id="back-to-admin-btn" style="margin-top:28px;padding:.7em 1.6em;">관리자 화면으로 돌아가기</button>
        </div>
      </div>`;
    document.getElementById("back-to-admin-btn").onclick = () => { sessionStorage.removeItem(ACTIVE_QUIZ_KEY); location.hash = "/admin"; };
  }

  resetTimerForCurrentQuestion();
  paintAll();
}

/* ---------------- 시작 ----------------
   모든 상수·함수가 준비된 뒤(스크립트 맨 끝)에서 첫 화면을 그림 */
if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", render);
else render();
</script>
</body>
</html>
